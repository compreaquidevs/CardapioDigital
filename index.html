let BOARD_KEY = '';
const boardKey = b => [b.board, b.datacriacao, b.emailautorcriacao].join('|');
const isBoard = b => b && Array.isArray(b.aplicacaocard) && Array.isArray(b.usuarios);
const isBoardMember = b => b.usuarios.some(u => sameEmail(u.email, ME.email));
const visibleBoards = () => DB.cards.filter(b => isBoard(b) && isBoardMember(b));
const currentBoard = () => visibleBoards().find(b => boardKey(b) == BOARD_KEY);

function viewKanban() {
  const lista = DB.cards.map((b, k) => ({ b, k })).filter(x => isBoard(x.b) && isBoardMember(x.b));
  return `
  <div class="wrap one"><div>
    <h2>Aplicação</h2><br>
    ${isApprover() ? `<button class="btn" onclick="openBoardForm()">＋ Novo board</button><br><br>` : ''}
    <div class="feats">
      ${lista.map(x => `
        <div class="box idea" style="cursor:pointer" onclick="openBoard(${x.k})">
          <h3>${esc(x.b.board)}</h3>
          <div class="meta">Criado por ${esc(getUser(x.b.emailautorcriacao).nome)} em ${esc(x.b.datacriacao)}</div>
          <div class="meta">${x.b.aplicacaocard.length} card(s) · ${x.b.usuarios.length} usuário(s)</div>
        </div>`).join('')}
    </div>
    ${lista.length ? '' : '<div class="box">Nenhum board disponível para você.</div>'}
  </div></div>`;
}

function openBoard(k) {
  const b = DB.cards[k];
  if (!isBoard(b) || !isBoardMember(b)) return;
  BOARD_KEY = boardKey(b);
  BFILTRO = { resp: '', prio: '', arq: false };
  go('board');
}

function openBoardForm() {
  if (!isApprover()) return;
  openModal(`
    <h3>Novo board</h3><br>
    <label>Nome do board</label><input id="b1">
    <label>Usuários com acesso</label>
    <div id="busers" style="max-height:200px;overflow:auto;margin-bottom:10px">
      ${companyUsers().filter(u => u.ativo).map(u => `
        <label style="display:flex;align-items:center;color:var(--fg)">
          <input type="checkbox" style="margin:0 6px 0 0" value="${esc(u.email)}" ${sameEmail(u.email, ME.email) ? 'checked disabled' : ''}>${esc(u.nome)}
        </label>`).join('')}
    </div>
    <p class="msg" id="bm"></p>
    <button class="btn" onclick="saveBoard()">Salvar</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
}

function saveBoard() {
  const nome = $('#b1').value.trim();
  if (!nome) return $('#bm').textContent = 'Informe o nome do board.';
  const users = [...document.querySelectorAll('#busers input:checked')].map(x => x.value);
  DB.cards.push({ board: nome, datacriacao: now(), emailautorcriacao: ME.email,
    usuarios: users.map(email => ({ email })), aplicacaocard: [] });
  save('cards'); closeM(); render();
  showToast('Board criado!');
}

let BFILTRO = { resp: '', prio: '', arq: false };
const canManageBoard = b => sameEmail(b.emailautorcriacao, ME.email) || isAdmin();
const cardAtrasado = c => !!c.prazo && c.status != 'FINALIZADO' && c.prazo < todayIso();

function viewBoard() {
  const b = currentBoard();
  if (!b) return `<div class="wrap one"><div class="box">Board não encontrado.<br><br><button class="btn" onclick="go('kanban')">Voltar</button></div></div>`;
  const f = BFILTRO;
  const cards = b.aplicacaocard.filter(c =>
    (!f.resp || sameEmail(c.emailautor, f.resp) || sameEmail(c.emailavaliador, f.resp)) &&
    (!f.prio || c.prioridade == f.prio) && (f.arq || !c.arquivado));
  const nArq = b.aplicacaocard.filter(c => c.arquivado).length;
  return `
  <div style="padding:16px">
    <button class="btn s o" onclick="go('kanban')">← Boards</button><br><br>
    <h2>${esc(b.board)}</h2><br>
    <button class="btn" onclick="openCardForm()">＋ Novo card</button>
    ${canManageBoard(b) ? `<button class="btn o" onclick="openBoardEdit()">✏️ Editar board</button>` : ''}<br><br>
    <div class="box filtros">
      <div><label>Responsável (autor ou avaliador)</label>
        <select onchange="BFILTRO.resp=this.value;render()"><option value="">Todos</option>
          ${b.usuarios.map(m => `<option value="${esc(m.email)}" ${sameEmail(m.email, f.resp) ? 'selected' : ''}>${esc(getUser(m.email).nome)}</option>`).join('')}</select></div>
      <div><label>Prioridade</label>
        <select onchange="BFILTRO.prio=this.value;render()"><option value="">Todas</option>
          ${[1, 2, 3].map(p => `<option value="${p}" ${f.prio == p ? 'selected' : ''}>${PRIORIDADE[p]}</option>`).join('')}</select></div>
      <div><label style="display:flex;align-items:center;margin-bottom:12px"><input type="checkbox" ${f.arq ? 'checked' : ''} onchange="BFILTRO.arq=this.checked;render()">Mostrar arquivados (${nArq})</label></div>
    </div>
    <div class="board">
      ${LANES.map(lane => `
        <div class="lane" data-lane="${lane}"><h4>${lane}</h4>${laneCards(cards, lane).map(c => {
          const atras = cardAtrasado(c);
          return `
            <div class="kc p${c.prioridade}${atras ? ' late' : ''}${c.arquivado ? ' arq' : ''}" data-id="${c.id}" onpointerdown="kStart(event, ${c.id})"><span class="kh" title="Arraste para mover">⠿</span><b>${esc(c.cardnome)}</b>
              <p class="meta">${esc(c.descricao)}<br>Autor: ${esc(getUser(c.emailautor).nome)}
                <br>Avaliador: ${esc(getUser(c.emailavaliador).nome)}<br>Prioridade: ${PRIORIDADE[c.prioridade]}
                ${c.prazo ? `<br>Prazo: ${fmtIso(c.prazo)}${atras ? ' <b style="color:#ff6b6b">⚠ atrasado</b>' : ''}` : ''}
                ${c.arquivado ? '<br>📦 Arquivado' : ''}</p>
              <button class="btn s o" onclick="openCardForm(${c.id})">Editar</button>
              <button class="btn s r" onclick="deleteCard(${c.id})">Excluir</button>
              ${c.status == 'FINALIZADO' ? `<button class="btn s o" onclick="toggleArquivar(${c.id})">${c.arquivado ? 'Desarquivar' : '📦 Arquivar'}</button>` : ''}
              ${cardComments(c)}
            </div>`; }).join('')}
        </div>`).join('')}
    </div>
  </div>`;
}

function toggleArquivar(id) {
  const b = currentBoard();
  const c = b && b.aplicacaocard.find(x => x.id == id);
  if (!c) return;
  if (c.arquivado) delete c.arquivado; else c.arquivado = true;
  save('cards'); render();
  showToast(c.arquivado ? 'Card arquivado.' : 'Card desarquivado.');
}

function openBoardEdit() {
  const b = currentBoard();
  if (!b || !canManageBoard(b)) return;
  const membro = e => b.usuarios.some(m => sameEmail(m.email, e));
  openModal(`
    <h3>Editar board</h3><br>
    <label>Nome do board</label><input id="be1" value="${esc(b.board)}">
    <label>Usuários com acesso</label>
    <div id="beusers" style="max-height:220px;overflow:auto;margin-bottom:10px">
      ${companyUsers().filter(u => u.ativo || membro(u.email)).map(u => `
        <label style="display:flex;align-items:center;color:var(--fg)">
          <input type="checkbox" style="margin:0 6px 0 0" value="${esc(u.email)}" ${membro(u.email) || sameEmail(u.email, b.emailautorcriacao) || sameEmail(u.email, ME.email) ? 'checked' : ''} ${sameEmail(u.email, b.emailautorcriacao) || sameEmail(u.email, ME.email) ? 'disabled' : ''}>${esc(u.nome)}
        </label>`).join('')}
    </div>
    <p class="msg" id="bem"></p>
    <button class="btn" onclick="saveBoardEdit()">Salvar</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>
    <button class="btn r" style="float:right" onclick="deleteBoard()">🗑 Excluir board</button>`);
}

function saveBoardEdit() {
  const b = currentBoard();
  if (!b || !canManageBoard(b)) return;
  const nome = $('#be1').value.trim();
  if (!nome) return $('#bem').textContent = 'Informe o nome do board.';
  const users = [...document.querySelectorAll('#beusers input:checked')].map(x => x.value);
  b.board = nome;
  b.usuarios = users.map(email => ({ email }));
  BOARD_KEY = boardKey(b);
  save('cards'); closeM(); render();
  showToast('Board atualizado!');
}

function deleteBoard() {
  const b = currentBoard();
  if (!b || !canManageBoard(b)) return;
  const key = boardKey(b);
  showConfirm(`Excluir o board "${b.board}" e todos os seus ${b.aplicacaocard.length} card(s)? Esta ação não pode ser desfeita.`, () => {
    const at = DB.cards.findIndex(x => isBoard(x) && boardKey(x) == key);
    if (at < 0) return;
    const ids = new Set(DB.cards[at].aplicacaocard.map(c => String(c.id)));
    DB.cards.splice(at, 1);
    DB.comentarioscard = DB.comentarioscard.filter(x => !ids.has(String(x.idcardaplicacao)));
    BOARD_KEY = '';
    save('cards', 'comentarioscard');
    go('kanban');
    showToast('Board excluído!');
  });
}

const laneCards = (cards, lane) => cards.filter(c => c.status == lane)
  .sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || b.prioridade - a.prioridade);
let kdrag = null;

function kStart(e, id) {
  if (e.pointerType == 'mouse' && e.button !== 0) return;
  if (e.target.closest('button,input,select,textarea,a')) return;
  if (e.pointerType != 'mouse' && !e.target.closest('.kh')) return;
  kCleanup();
  kdrag = { id, el: e.currentTarget, x0: e.clientX, y0: e.clientY, started: false, lane: null, before: null };
  document.addEventListener('pointermove', kMove);
  document.addEventListener('pointerup', kEnd);
  document.addEventListener('pointercancel', kCleanup);
  document.addEventListener('keydown', kKey);
}

function kMove(e) {
  const d = kdrag;
  if (!d) return;
  if (!d.started) {
    if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    const r = d.el.getBoundingClientRect();
    d.started = true; d.dx = d.x0 - r.left; d.dy = d.y0 - r.top;
    d.ghost = d.el.cloneNode(true);
    d.ghost.classList.add('kfloat');
    d.ghost.style.width = r.width + 'px';
    document.body.appendChild(d.ghost);
    d.el.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  d.ghost.style.left = (e.clientX - d.dx) + 'px';
  d.ghost.style.top = (e.clientY - d.dy) + 'px';

  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  d.lane = d.before = null;
  const lane = (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest('.lane');
  if (lane) {
    lane.classList.add('over');
    d.lane = lane.dataset.lane;
    const alvo = [...lane.querySelectorAll('.kc:not(.dragging)')].find(c => {
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    d.before = alvo ? +alvo.dataset.id : null;
    const marca = document.createElement('div');
    marca.className = 'kdrop';
    if (alvo) lane.insertBefore(marca, alvo); else lane.appendChild(marca);
  }
  const board = document.querySelector('.board');
  if (board) {
    const b = board.getBoundingClientRect();
    if (e.clientX < b.left + 40) board.scrollLeft -= 16; else if (e.clientX > b.right - 40) board.scrollLeft += 16;
  }
  if (e.clientY < 70) scrollBy(0, -16); else if (e.clientY > innerHeight - 70) scrollBy(0, 16);
}

function kEnd() {
  const d = kdrag;
  kCleanup();
  if (d && d.started && d.lane) moveCard(d.id, d.lane, d.before);
}
const kKey = e => { if (e.key == 'Escape') kCleanup(); };

function kCleanup() {
  ['pointermove', 'pointerup', 'pointercancel', 'keydown'].forEach((t, k) =>
    document.removeEventListener(t, [kMove, kEnd, kCleanup, kKey][k]));
  if (kdrag) { if (kdrag.ghost) kdrag.ghost.remove(); kdrag.el.classList.remove('dragging'); }
  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  document.body.style.userSelect = '';
  kdrag = null;
}

function moveCard(id, lane, beforeId) {
  const b = currentBoard();
  const c = b && b.aplicacaocard.find(x => x.id == id);
  if (!c) return;
  const dest = laneCards(b.aplicacaocard, lane).filter(x => x.id != id);
  const at = beforeId == null ? -1 : dest.findIndex(x => x.id == beforeId);
  dest.splice(at < 0 ? dest.length : at, 0, c);
  if (c.status != lane) c.dataconclusao = lane == 'FINALIZADO' ? now() : '';
  c.status = lane;
  if (lane != 'FINALIZADO') delete c.arquivado;
  dest.forEach((x, k) => { x.ordem = k + 1; });
  save('cards');
  render();
}

function openCardForm(id) {
  const b = currentBoard();
  if (!b) return;
  const c = b.aplicacaocard.find(x => x.id == id) || { emailautor: ME.email, status: 'PARA FAZER', prioridade: 1 };
  const userOpts = sel => companyUsers().filter(u => b.usuarios.some(m => sameEmail(m.email, u.email))).map(u => `<option value="${u.email}" ${u.email == sel ? 'selected' : ''}>${esc(u.nome)}</option>`).join('');
  openModal(`
    <h3>Card</h3><br>
    <label>Título</label><input id="k1" value="${esc(c.cardnome)}">
    <label>Descrição</label><textarea id="k2">${esc(c.descricao)}</textarea>
    <label>Autor</label><select id="k3">${userOpts(c.emailautor)}</select>
    <label>Usuário avaliador</label><select id="k4">${userOpts(c.emailavaliador)}</select>
    <label>Status</label><select id="k5">${optionList(LANES, c.status)}</select>
    <label>Prioridade</label>
    <select id="k6">${[1, 2, 3].map(p => `<option value="${p}" ${p == c.prioridade ? 'selected' : ''}>${p} -${PRIORIDADE[p]}</option>`).join('')}</select>
    <label>Prazo</label><input id="k7" type="date" value="${esc(c.prazo || '')}">
    <button class="btn" onclick="saveCard(${id || 0})">Salvar</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
}
function saveCard(id) {
  if (!$('#k1').value.trim()) return;
  const b = currentBoard();
  if (!b) return;
  const c = b.aplicacaocard.find(x => x.id == id) || { id: Date.now(), empresa: ME.empresa, data: now() };
  const avaliadorAntigo = c.emailavaliador || '';
  if (c.status && c.status != $('#k5').value) delete c.ordem;
  Object.assign(c, { cardnome: $('#k1').value, descricao: $('#k2').value, emailautor: $('#k3').value,
    emailavaliador: $('#k4').value, status: $('#k5').value, prioridade: +$('#k6').value, prazo: $('#k7').value });
  if (c.status == 'FINALIZADO') c.dataconclusao = now(); else delete c.arquivado;
  if (!id) b.aplicacaocard.push(c);
  if (c.emailavaliador && !sameEmail(c.emailavaliador, avaliadorAntigo) && !sameEmail(c.emailavaliador, ME.email))
    pushNotification({ tipo: 'avaliador_card', destinoEmail: c.emailavaliador, titulo: 'Você é avaliador de um card',
      mensagem: `${ME.nome} definiu você como avaliador do card "${c.cardnome}" no board "${b.board}".` });
  save('cards'); closeM(); render();
  showToast('Card salvo!');
}
function deleteCard(id) {
  showConfirm('Deseja realmente excluir este card?', () => {
    const b = currentBoard();
    if (b) b.aplicacaocard = b.aplicacaocard.filter(c => c.id != id);
    DB.comentarioscard = DB.comentarioscard.filter(x => x.idcardaplicacao != id);
    save('cards', 'comentarioscard'); render();
    showToast('Card excluído!');
  });
}

/* ======================= COMENTÁRIOS DOS CARDS ========================== */
function cardComments(c) {
  const list = DB.comentarioscard.filter(x => x.idcardaplicacao == c.id)
    .sort((a, b) => (parseDate(a.data) - parseDate(b.data)) || 0);
  return `
    <div class="kcm">
      ${list.map(x => `<div class="cm"><b>${esc(getUser(x.autorcomentario).nome)}</b> <small>${esc(x.data)}</small><br>${fmtComent(x.comentario)}</div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <input id="kc${c.id}" placeholder="Comentar... (@ para citar)" autocomplete="off" oninput="mentionSuggest(this)" onkeydown="if(event.key=='Enter')addCardComment(${c.id})">
      <button class="btn s" onclick="addCardComment(${c.id})">Enviar</button>
    </div>
    <div class="mnt" id="mn_kc${c.id}"></div>`;
}

function addCardComment(id) {
  const el = $('#kc' + id);
  const texto = el ? el.value.trim() : '';
  if (!texto) return;
  DB.comentarioscard.push({ idcardaplicacao: id, autorcomentario: ME.email, comentario: texto, data: now() });

  const b = currentBoard();
  const card = b && b.aplicacaocard.find(x => x.id == id);
  const nome = card ? card.cardnome : '';
  const mencoes = notifMencoes(texto, `no card "${nome}"`, {});
  const jaAvisados = mencoes.map(n => n.destinoEmail);
  const notifs = [...mencoes];
  if (card) [card.emailautor, card.emailavaliador].filter(Boolean).forEach(e => {
    if (sameEmail(e, ME.email) || [...jaAvisados, ...notifs.map(n => n.destinoEmail)].some(x => sameEmail(x, e))) return;
    notifs.push({ tipo: 'comentario_card', destinoEmail: e, titulo: 'Novo comentário no seu card',
      mensagem: `${ME.nome} comentou no card "${nome}" do board "${b.board}".` });
  });
  pushNotifications(notifs);
  save('comentarioscard'); render();
}

/* ================================ METAS ================================= */
let SHOW_DONE_GOALS = false;
const sameEmail = (a, b) => String(a || '').trim().toLowerCase() == String(b || '').trim().toLowerCase();
const canSeeGoal = m => sameEmail(m.autor, ME.email) || m.usuarios.some(u => sameEmail(u.email, ME.email));

const ideiasImplantadas = camp => companyIdeas().filter(i => i.programaideia == camp && i.status == 'implantada').length;
const goalPct = m => m.campanha && m.alvo > 0
  ? Math.min(100, Math.round(ideiasImplantadas(m.campanha) * 100 / m.alvo))
  : m.porcentagemConclusao;
const goalAtrasada = m => goalPct(m) < 100 && !!m.dataPrevisaoConclusao && parseDate(m.dataPrevisaoConclusao) < new Date();

function viewGoals() {
  const lista = DB.metas.map((m, k) => ({ m, k }))
    .filter(x => canSeeGoal(x.m) && (SHOW_DONE_GOALS || goalPct(x.m) < 100))
    .sort((a, b) => (parseDate(b.m.dataCriacao) - parseDate(a.m.dataCriacao)) || 0);
  return `
  <div class="wrap one"><div>
    <h2>Metas</h2><br>
    ${isApprover() ? `<button class="btn" onclick="openGoalForm()">＋ Nova meta</button><br><br>` : ''}
    <label><input type="checkbox" ${SHOW_DONE_GOALS ? 'checked' : ''} onchange="SHOW_DONE_GOALS=this.checked;render()">Mostrar metas concluídas</label><br><br>
    ${lista.map(x => goalCard(x.m, x.k)).join('') || '<div class="box">Nenhuma meta ativa.</div>'}
  </div></div>`;
}

function goalCard(m, k) {
  const pct = goalPct(m), atras = goalAtrasada(m);
  return `
  <div class="box idea${atras ? ' late' : ''}">
    <h3>${esc(m.meta)} <span class="badge ${pct >= 100 ? 's-implantada' : 's-implantacao'}">${pct}%</span>${atras ? ' <span class="badge late">⏰ Prazo vencido</span>' : ''}</h3>
    <div class="pbar"><div style="width:${pct}%"></div></div>
    ${m.campanha ? `<div class="meta">🎯 Campanha: ${esc(m.campanha)} · ${ideiasImplantadas(m.campanha)} de ${m.alvo} ideia(s) implantada(s)</div>` : ''}
    <div class="meta">Criada por ${esc(getUser(m.autor).nome)} em ${esc(m.dataCriacao)} · Previsão de conclusão: ${esc(m.dataPrevisaoConclusao)}</div>
    <div class="meta">Usuários: ${m.usuarios.map(u => esc(getUser(u.email).nome)).join(', ') || '-'}</div>
    ${m.submeta.map((x, j) => `
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.95rem;padding:3px 0;cursor:pointer">
        <input type="checkbox" style="margin:0" ${x.concluida ? 'checked' : ''} onchange="toggleSubgoal(${k},${j},this.checked)">
        <span style="${x.concluida ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(x.descricao)}</span>
        ${x.responsavel ? `<small style="color:var(--mut)">· Responsável: ${esc(getUser(x.responsavel).nome)}</small>` : ''}
      </label>`).join('')}
    ${isApprover() ? `<br><button class="btn s r" onclick="deleteGoal(${k})">Excluir</button>` : ''}
  </div>`;
}

function toggleSubgoal(k, j, val) {
  const m = DB.metas[k];
  if (!m || !m.submeta[j] || !canSeeGoal(m)) return;
  const sub = m.submeta[j], antes = sub.concluida;
  sub.concluida = !!val;
  if (sub.concluida) sub.concluidaPor = ME.email; else delete sub.concluidaPor;
  m.porcentagemConclusao = metaPct(m.submeta);
  if (sub.concluida && !antes) {
    const dest = [...new Set([m.autor, sub.responsavel].filter(e => e && !sameEmail(e, ME.email)))];
    pushNotifications(dest.map(e => ({ tipo: 'submeta_concluida', destinoEmail: e, titulo: 'Submeta concluída',
      mensagem: `${ME.nome} concluiu a submeta "${sub.descricao}" da meta "${m.meta}".` })));
  }
  save('metas'); render();
  if (goalPct(m) == 100) showToast('Meta concluída!');
}

function openGoalForm() {
  if (!isApprover()) return;
  openModal(`
    <h3>Nova meta</h3><br>
    <label>Meta</label><input id="m1">
    <label>Previsão de conclusão</label><input id="m2" type="date">
    <label>Campanha (opcional): a meta mede as ideias implantadas da campanha</label>
    <select id="m3" onchange="$('#m4w').style.display=this.value?'':'none'">
      <option value="">Sem campanha</option>
      ${companyPrograms().map(p => `<option value="${esc(p.programaideia)}">${esc(p.programaideia)}</option>`).join('')}
    </select>
    <div id="m4w" style="display:none"><label>Quantidade de ideias a implantar</label><input id="m4" type="number" min="1" value="5"></div>
    <label>Submetas (obrigatório ao menos uma, exceto em meta ligada a campanha)</label>
    <div id="msubs"></div>
    <button class="btn s o" onclick="addSubgoalField()">＋ Adicionar submeta</button><br><br>
    <label>Usuários com acesso</label>
    <div id="musers" style="max-height:160px;overflow:auto;margin-bottom:10px">
      ${companyUsers().filter(u => u.ativo).map(u => `
        <label style="display:flex;align-items:center;color:var(--fg)">
          <input type="checkbox" style="margin:0 6px 0 0" value="${esc(u.email)}" ${sameEmail(u.email, ME.email) ? 'checked disabled' : ''}>${esc(u.nome)}
        </label>`).join('')}
    </div>
    <p class="msg" id="mm"></p>
    <button class="btn" onclick="saveGoal()">Salvar</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
  addSubgoalField(false);
}

function addSubgoalField(focus = true) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.marginBottom = '8px';
  const opts = companyUsers().filter(u => u.ativo).map(u => `<option value="${esc(u.email)}">${esc(u.nome)}</option>`).join('');
  row.innerHTML = `<input class="sg" placeholder="Descrição da submeta"><select class="sgr" title="Responsável" style="max-width:40%;margin-bottom:0"><option value="">Sem responsável</option>${opts}</select><button class="btn s r" type="button" onclick="this.parentNode.remove()">✕</button>`;
  $('#msubs').appendChild(row);
  if (focus) row.querySelector('input').focus();
}

function saveGoal() {
  const meta = $('#m1').value.trim(), prev = $('#m2').value;
  const camp = $('#m3').value, alvo = parseInt($('#m4').value, 10) || 0;
  const subs = [...document.querySelectorAll('#msubs .row')]
    .map(r => ({ descricao: r.querySelector('.sg').value.trim(), concluida: false, responsavel: r.querySelector('.sgr').value }))
    .filter(x => x.descricao);
  const marcados = [...document.querySelectorAll('#musers input:checked')].map(x => x.value);
  const users = [...new Set([...marcados, ...subs.map(x => x.responsavel).filter(Boolean)])];
  const erro = t => { $('#mm').textContent = t; };
  if (!meta) return erro('Informe a meta.');
  if (!prev) return erro('Informe a previsão de conclusão.');
  if (camp && alvo < 1) return erro('Informe quantas ideias devem ser implantadas.');
  if (!camp && !subs.length) return erro('Cadastre ao menos uma submeta.');
  const [y, mo, d] = prev.split('-');
  DB.metas.push({
    meta,
    campanha: camp,
    alvo: camp ? alvo : 0,
    dataPrevisaoConclusao: `${d}-${mo}-${y} 23:59`,
    dataCriacao: now(),
    porcentagemConclusao: 0,
    avisoVencida: '',
    autor: ME.email,
    submeta: subs,
    usuarios: users.map(email => ({ email }))
  });
  save('metas'); closeM(); render();
  showToast('Meta cadastrada!');
}

function deleteGoal(k) {
  const m = DB.metas[k];
  if (!m || !isApprover()) return;
  const key = SYNC.metas.key(m);
  showConfirm(`Deseja realmente excluir a meta "${m.meta}"?`, () => {
    const at = DB.metas.findIndex(x => SYNC.metas.key(x) == key);
    if (at < 0) return;
    DB.metas.splice(at, 1);
    save('metas'); render();
    showToast('Meta excluída!');
  });
}

/* ============================ 12. NOTIFICAÇÕES =========================== */
async function refreshNotifs() {
  try { const l = await loadTable('notificacoes'); if (l) DB.notificacoes = l; } catch (e) { }
}

let notifQueue = Promise.resolve();
function pushNotifications(lista) {
  if (!lista || !lista.length) return Promise.resolve();
  notifQueue = notifQueue.then(async () => {
    try {
      const list = (await loadTable('notificacoes')) || DB.notificacoes || [];
      const base = Date.now();
      lista.forEach((n, k) => list.push({ id: base + k, data: now(), lida: false, ...n }));
      DB.notificacoes = list;
      await writeTable('notificacoes');
    } catch (e) { console.warn('Erro ao disparar notificação:', e); }
  });
  return notifQueue;
}
const pushNotification = notifObj => pushNotifications([notifObj]);

/* lembrete de avaliação atrasada (ao aprovador) e aviso de meta vencida (autor e usuários) */
function checkPrazos() {
  if (!ME || !DB.ideias) return;
  const notifs = [];
  let mudouI = false, mudouM = false;

  companyIdeas().forEach(i => {
    if (!sameEmail(i.emailaprovador, ME.email) || !ideaAtrasada(i)) return;
    if (i.ultimoLembrete && diasDesde(i.ultimoLembrete) < PRAZO_AVALIACAO_DIAS) return;
    i.ultimoLembrete = now(); mudouI = true;
    notifs.push({ tipo: 'prazo_avaliacao', destinoEmail: ME.email, titulo: 'Ideia aguardando sua avaliação',
      mensagem: `A ideia "${i.titulo}" está há ${Math.floor(diasDesde(ultimaMov(i)))} dias sem avaliação (prazo de ${PRAZO_AVALIACAO_DIAS} dias).`, idideia: i.id });
  });

  DB.metas.forEach(m => {
    if (!canSeeGoal(m) || !goalAtrasada(m) || m.avisoVencida) return;
    m.avisoVencida = now(); mudouM = true;
    const dest = [...new Set([m.autor, ...m.usuarios.map(u => u.email)].map(e => String(e || '').trim()).filter(Boolean))];
    dest.forEach(e => notifs.push({ tipo: 'meta_vencida', destinoEmail: e, titulo: 'Meta com prazo vencido',
      mensagem: `A meta "${m.meta}" passou do prazo (${String(m.dataPrevisaoConclusao).slice(0, 10)}) e ainda não foi concluída.` }));
  });

  if (mudouI) save('ideias');
  if (mudouM) save('metas');
  if (notifs.length) {
    pushNotifications(notifs).then(() => { updateMenuBadge(); if (VIEW == 'notificacoes') render(); });
    if (notifs.some(n => n.destinoEmail == ME.email))
      showToast('Você tem novos avisos de prazo nas notificações.', 'warning');
  }
}

const userNotifs = () => (DB.notificacoes || []).filter(n => 
  String(n.destinoEmail).toLowerCase() === ME.email.toLowerCase() && !n.lida
);

const pendingResets = () => (DB.notificacoes || []).filter(n => n.tipo == 'recuperar_senha' && n.status == 'pendente' &&
  ((n.gestores || []).some(g => String(g).toLowerCase() == ME.email.toLowerCase()) || (isAdmin() && n.empresa == ME.empresa)));

function updateMenuBadge() {
  if (!ME) return;
  const nResets = pendingResets().length;
  const nNotifs = userNotifs().length;
  const total = nResets + nNotifs;
  
  const btn = $('#optbtn');
  const mnuNotifs = $('#mnuNotifs');
  
  if (btn) btn.textContent = '☰' + (total ? ' 🔔' + total : '');
  if (mnuNotifs) mnuNotifs.innerHTML = `Notificações${nNotifs ? ' (' + nNotifs + ')' : ''}`;
}

function viewNotifications() {
  const list = (DB.notificacoes || []).filter(n => String(n.destinoEmail).toLowerCase() === ME.email.toLowerCase());
  return `
  <div class="wrap one"><div>
    <h2>Minhas Notificações</h2><br>
    <button class="btn s o" onclick="refreshNotifs().then(render)">↻ Atualizar</button><br><br>
    ${byNewest(list).map(n => `
      <div class="box idea" style="${n.lida ? 'opacity:0.6;' : 'border-left-color:var(--g);'}">
        <h3>${esc(n.titulo)}</h3>
        <p>${esc(n.mensagem)}</p>
        <div class="meta">${esc(n.data)}</div>${!n.lida ? `<button class="btn s" onclick="markNotifAsRead(${n.id})">Marcar como lida</button>` : '<small>Lida</small>'}
      </div>`).join('') || '<div class="box">Nenhuma notificação encontrada.</div>'}
  </div></div>`;
}

async function markNotifAsRead(id) {
  const n = (DB.notificacoes || []).find(x => x.id === id);
  if (n) {
    n.lida = true;
    await writeTable('notificacoes');
    render();
  }
}

/* ===================== 13. SOLICITAÇÕES DE SENHA (GESTOR) ================ */
function viewPasswordRequests() {
  const list = pendingResets();
  return `
  <div class="wrap one"><div>
    <h2>Solicitações de senha</h2>
    <p class="meta">Quando alguém esquece a senha, você define uma nova aqui e envia para a pessoa manualmente.</p>
    <button class="btn s o" onclick="refreshNotifs().then(render)">↻ Atualizar</button><br><br>
    ${list.map(n => `
      <div class="box idea"><h3>${esc(getUser(n.emailusuario).nome)}</h3>
        <p>${esc(n.emailusuario)}</p><div class="meta">Solicitado em ${esc(n.data)}</div>
        <button class="btn s" onclick="openResetForm(${n.id})">Definir nova senha</button>
        <button class="btn s o" onclick="dismissReset(${n.id})">Dispensar</button>
      </div>`).join('') || '<div class="box">Nenhuma solicitação pendente.</div>'}
  </div></div>`;
}

function randomPassword(len = 8) {
  const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint32Array(len))].map(n => abc[n % abc.length]).join('');
}

function openResetForm(id) {
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n) return;
  openModal(`
    <h3>Nova senha para ${esc(getUser(n.emailusuario).nome)}</h3>
    <p class="meta">${esc(n.emailusuario)}</p><br>
    <label>Nova senha (pode trocar a sugestão)</label>
    <input id="np" value="${randomPassword()}">
    <p class="meta">Depois de salvar, envie esta senha para a pessoa. Ela pode alterá-la em "Meu perfil".</p>
    <p class="msg" id="nm"></p>
    <button class="btn" id="nbtn" onclick="resolveReset(${id})">Salvar nova senha</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
}

async function closeNotif(id, status) {
  await refreshNotifs();
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n || n.status != 'pendente') throw new Error('Esta solicitação já foi tratada por outra pessoa.');
  Object.assign(n, { status, dataatendimento: now(), atendidopor: ME.email });
  await writeTable('notificacoes');
}

async function dismissReset(id) {
  showConfirm('Dispensar esta solicitação sem alterar a senha?', async () => {
    try { 
      await closeNotif(id, 'dispensada'); 
      showToast('Solicitação dispensada.');
    } catch (e) { 
      showToast(e.message || 'Falha ao dispensar.', 'warning'); 
    }
    render();
  });
}

/* ========================== 14. INICIALIZAÇÃO =========================== */
(async () => {
  const hash = location.hash;
  if (hash == '#empresa') return renderCompanyPage();
  if (hash == '#termos') return renderDocPage('Termos de uso', TERMOS);
  if (hash == '#privacidade') return renderDocPage('Política de privacidade', PRIVACIDADE);

  document.body.innerHTML = '<div class="login"><p>Carregando...</p></div>';
  try { DB.usuarios = (await loadTable('usuarios')) || []; } catch (e) { DB.usuarios = []; }
  savedLogin.purgeLegacy();
  
  const ativa = sessao.load();
  if (ativa) {
    try {
      const r = await validarCredenciais(ativa.email.toLowerCase(), ativa.senha);
      if (r.user) { ME = r.user; return startApp(); }
    } catch (e) { limparSegredos(); }
    sessao.clear();
  }
  renderLogin();
})();
