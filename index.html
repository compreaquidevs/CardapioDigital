<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIGHT - Plataforma de ideias</title>
<style>
:root {
  --bg:#1b1d20;
  --bg2:#26292e;
  --bg3:#31353b;
  --fg:#fff;
  --mut:#a9afb8;
  --g:#10b981;
  --gd:#1f9e0a
}
* {
  box-sizing:border-box;
  margin:0
}
body {
  font-family:"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  padding-bottom:80px
}
button,input,select,textarea {
  font:inherit
}
a {
  color:var(--g)
}
.btn {
  background:var(--g);
  color:#111;
  border:0;
  padding:10px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}
.btn:hover {
  box-shadow:0 0 16px var(--g);
  transform:translateY(-1px)
}
.btn.o {
  background:none;
  color:var(--g);
  border:1px solid var(--g)
}
.btn.r {
  background:#444850;
  color:#fff;
  border:1px solid #555b66
}
.btn.r:hover {
  background:#525863;
  box-shadow:0 0 12px rgba(255,255,255,0.1)
}
.btn.s {
  padding:5px 11px;
  font-size:.85rem
}
input,select,textarea {
  width:100%;
  background:var(--bg3);
  border:1px solid #444;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin:4px 0 10px
}
input:focus,select:focus,textarea:focus {
  outline:0;
  border-color:var(--g);
  box-shadow:0 0 0 2px #39ff1433
}
input[readonly],textarea[readonly] {
  opacity:.6
}
input[type=checkbox] {
  width:auto;
  margin-right:6px
}
label {
  font-size:.85rem;
  color:var(--mut)
}
header {
  position:sticky;
  top:0;
  z-index:50;
  background:#14161899;
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--g);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 20px
}
header img {
  height:44px;
  cursor:pointer;
  border-radius:12px
}
header.hc {
  display:grid;
  grid-template-columns:1fr auto 1fr
}
header.hc .menu {
  justify-self:end
}
.menu {
  position:relative
}
.drop {
  display:none;
  position:absolute;
  right:0;
  top:46px;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:12px;
  min-width:230px;
  overflow:hidden;
  box-shadow:0 10px 30px #000a
}
.drop.on {
  display:block
}
.drop a {
  display:block;
  padding:11px 16px;
  color:#fff;
  text-decoration:none;
  cursor:pointer
}
.drop a:hover {
  background:var(--g);
  color:#111
}
.wrap {
  max-width:1150px;
  margin:20px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 290px;
  gap:20px
}
.wrap.one {
  grid-template-columns:1fr
}
.box {
  background:var(--bg2);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  border:1px solid #3a3f46
}
.idea {
  border-left:4px solid var(--g)
}
.idea h3 {
  color:var(--g);
  margin-bottom:6px
}
.meta {
  color:var(--mut);
  font-size:.82rem;
  margin:6px 0
}
.badge {
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:700;
  color:#111
}
.s-rascunho { background:#888 }
.s-pendente,.s-avaliacao-inicial,.s-avaliacao-de-negocio { background:#a6ffa0 }
.s-aguardando { background:#ffd93b }
.s-implantacao { background:#1b8a3a; color:#fff }
.s-implantada { background:#2f80ff; color:#fff }
.s-reprovada { background:#e53935; color:#fff }

.act button {
  background:none;
  border:1px solid #555;
  color:#fff;
  border-radius:20px;
  padding:4px 12px;
  cursor:pointer;
  margin-right:6px
}
.act button.on {
  border-color:var(--g);
  color:var(--g)
}
.cm {
  background:var(--bg3);
  border-radius:10px;
  padding:8px 12px;
  margin:6px 0;
  font-size:.9rem
}
.cm small {
  color:var(--mut)
}
.row {
  display:flex;
  gap:8px
}
.row input {
  margin-bottom:0
}
.av {
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--g);
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex:none
}
.sc {
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #3a3f46
}
.sc b {
  margin-left:auto;
  color:var(--g)
}
.car {
  position:relative;
  height:260px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:12px
}
.car img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:.8s
}
.car img.on {
  opacity:1
}
.car button {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:#000a;
  color:var(--g);
  border:0;
  font-size:1.6rem;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.4)
}
.car button span {
  display:inline-block;
  margin-top:-3px
}
.dots {
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center
}
.dots i {
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff6;
  margin:0 4px;
  cursor:pointer
}
.dots i.on {
  background:var(--g)
}
.quote {
  text-align:center;
  font-style:italic;
  color:var(--mut);
  padding:8px 0 18px
}
.fab {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#141618f0;
  border-top:1px solid var(--g);
  padding:12px;
  text-align:center;
  z-index:40
}
#modal {
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:90;
  overflow:auto;
  padding:20px
}
#modal.on {
  display:block
}
#modal>div {
  max-width:560px;
  margin:auto;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:18px;
  padding:22px
}
.login {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:radial-gradient(circle at 20% 10%,#1f3a1a,var(--bg) 55%)
}
.login .box {
  width:100%;
  max-width:400px;
  text-align:center
}
.login img {
  height:70px;
  margin-bottom:10px;
  border-radius:12px
}
.cta {
  display:block;
  margin-top:14px;
  padding:13px;
  border-radius:30px;
  background:linear-gradient(90deg,var(--g),#b6ff3b);
  color:#111;
  font-weight:800;
  text-decoration:none;
  box-shadow:0 0 22px #39ff1466
}
.doc {
  max-width:800px;
  margin:30px auto;
  padding:20px;
  line-height:1.7
}
.doc h1,.doc h2 {
  color:var(--g);
  margin:18px 0 8px
}
.board {
  display:grid;
  grid-template-columns:repeat(5,minmax(220px,1fr));
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px
}
.lane {
  background:var(--bg2);
  border-radius:14px;
  padding:10px;
  min-height:200px
}
.lane h4 {
  color:var(--g);
  margin-bottom:8px
}
.kc {
  background:var(--bg3);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  border-left:5px solid;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none
}
.kc .kh {
  float:right;
  margin:-4px -2px 0 8px;
  padding:2px 6px;
  color:var(--mut);
  font-size:1.1rem;
  line-height:1;
  touch-action:none;
  cursor:grab
}
.kc.dragging {
  opacity:.3
}
.kfloat {
  position:fixed;
  z-index:3000;
  margin:0;
  pointer-events:none;
  opacity:.95;
  transform:rotate(2deg);
  box-shadow:0 12px 32px rgba(0,0,0,.55)
}
.lane.over {
  outline:2px dashed var(--g);
  outline-offset:-2px
}
.kdrop {
  height:4px;
  border-radius:4px;
  background:var(--g);
  margin:0 0 8px
}
.p1 { border-color:#4caf50 }
.p2 { border-color:#ffd93b }
.p3 { border-color:#e53935 }
.msg { color:#ff6b6b; font-size:.85rem; min-height:18px }

/* Toast Notifications Container & Component */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
.toast {
  background: var(--bg2);
  color: var(--fg);
  border: 1px solid var(--g);
  padding: 14px 22px;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  font-size: 0.92rem;
  font-weight: 600;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 420px;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.toast.warning {
  border-color: #ffd93b;
  background: #2b281d;
  color: #ffe885;
}
.toast.error {
  border-color: #e53935;
  background: #2d1d1f;
  color: #ff9e9e;
}

.filtros {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:0 12px;
  align-items:end
}
.filtros .btn { margin-bottom:10px }
.indic {
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap
}
.indic h3 { color:var(--g); margin-bottom:4px }
.donut { position:relative; width:140px; height:140px; flex:none }
.donut svg { width:100%; height:100%; transform:rotate(-90deg) }
.donut .ct {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.15
}
.donut .ct b { font-size:1.5rem }
.donut .ct small { color:var(--mut); font-size:.72rem }
.leg { display:flex; flex-direction:column; gap:8px }
.leg span { display:flex; align-items:center; gap:8px }
.leg i { width:12px; height:12px; border-radius:50%; display:inline-block }
.feats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin:12px 0
}
.feats .box { margin:0 }
.feats h3 { color:var(--g); font-size:1rem; margin-bottom:6px }
.steps { display:flex; flex-direction:column; gap:10px; margin:12px 0 }
.steps .st { display:flex; gap:12px; align-items:flex-start }
.steps .st p { margin:0 }
.doc ul { margin:8px 0 8px 22px }
.car img.logo { object-fit:contain; background:var(--bg2) }
.pbar { height:10px; border-radius:10px; background:#3a3f46; overflow:hidden; margin:8px 0 }
.pbar div { height:100%; background:var(--g); border-radius:10px; transition:.3s }
.kcm { max-height:150px; overflow:auto; margin-top:8px }
.kc input { user-select:text; -webkit-user-select:text }

/* --- novos recursos --- */
.box.idea.late,.idea.late { border-left-color:#e53935 }
.box.late { border-color:#e53935 }
.badge.late { background:#e53935; color:#fff }
.kc.late { box-shadow:0 0 0 2px #e53935 }
.kc.arq { opacity:.6 }
.tag { display:inline-block; background:var(--bg3); border:1px solid #444; color:var(--g); border-radius:20px; padding:1px 10px; font-size:.78rem; margin:0 4px 4px 0; cursor:pointer }
.tag.on { background:var(--g); color:#111; border-color:var(--g) }
.men { color:var(--g); font-weight:700 }
.mnt { display:none; background:var(--bg3); border:1px solid var(--g); border-radius:10px; margin-top:4px; overflow:hidden }
.mnt.on { display:block }
.mnt div { padding:7px 12px; cursor:pointer; font-size:.9rem }
.mnt div:hover { background:var(--g); color:#111 }
.dup { background:var(--bg3); border:1px dashed #ffd93b; border-radius:10px; padding:8px 12px; margin:-4px 0 10px; font-size:.85rem }
.tl summary { cursor:pointer; color:var(--g); font-size:.88rem; margin:6px 0 }
.tlb { border-left:2px solid #3a3f46; margin:8px 0 4px 5px; padding-left:16px }
.tle { position:relative; padding:0 0 10px; font-size:.88rem }
.tle i { position:absolute; left:-22px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--g) }
.car .sl { position:absolute; inset:0; opacity:0; transition:.8s; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px 64px; background:linear-gradient(135deg,#1f3a1a,#26292e) }
.car .sl.on { opacity:1 }
.car .sl h2 { color:var(--g); margin:6px 0 }
.car .sl small { color:#ffd93b; font-weight:700; letter-spacing:.04em }
.brow { display:flex; align-items:center; gap:10px; margin:5px 0; font-size:.88rem }
.brow .bl { width:120px; flex:none; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.brow .bt { flex:1; height:12px; background:#3a3f46; border-radius:8px; overflow:hidden }
.brow .bt div { height:100%; background:var(--g) }
.kpi { font-size:1.8rem; font-weight:800; color:var(--g) }

@media (max-width:820px) {
  .wrap { grid-template-columns:1fr }
  .car { height:170px }
  header img { height:34px }
  #toast-container { left: 16px; right: 16px; bottom: 85px; }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0, 0, 0, 0.3);
  border-radius: 50%;
  border-top-color: #111;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast-container"></div>
<script>
/* =========================================================================
   INSIGHT - Plataforma de ideias
   Índice:  1 Config · 2 Utilitários · 3 Dados (Gists) · 4 Textos estáticos
            5 Autenticação · 6 Estrutura do app · 7 Ideias · 8 Perfil
            9 Campanhas · 10 Usuários · 11 Kanban · 12 Notificações · 13 Inicialização
   ========================================================================= */

/* ============================ 1. CONFIG ================================= */
/* Fixos: usuários (consultado antes do login) e empresas. Os demais ids são lidos da empresa do usuário logado (campo nomeempresa). */
const GISTS = {
  usuarios: '9525a941c8117f69ccaa9963d0c0c966',
  empresas: 'da1e4c92d15573ff57306fb167b00015'//'e049dd6337764d33ae7770678e01a801'
};
const TABLES = ['usuarios', 'perfis', 'cards', 'curtidas', 'comentarios', 'ideias', 'empresas',
  'programas', 'notificacoes', 'metas', 'comentarioscard'];
let EMPRESA = null;
const PREFIXO_LEN = 4;
const GTM = 'QlGGY' + 'jPfBj4Noe3LgkuJLRDohc' + '9Z941iKt';
const USUARIOS_GIST_ID = '9525a941c8117f69ccaa9963d0c0c966';
const USUARIOS_GIST_DONO = 'compreaquidevs';
let GH_TOKEN = '';
let USUARIOS_BUSCA_ID = '';
let USUARIOS_RAW = '';
let LOGIN_PREFIX = '';

function limparSegredos() { LOGIN_PREFIX = GH_TOKEN = USUARIOS_BUSCA_ID = USUARIOS_RAW = ''; }
async function tokenValido() {
  try { return (await fetch('https://api.github.com/gists/' + USUARIOS_BUSCA_ID, { headers: authHeaders(), cache: 'no-store' })).ok; }
  catch (e) { return false; }
}

const STATUS = ['rascunho', 'pendente', 'em avaliação inicial', 'em avaliação de negócio',
  'aguardando resposta do idealizador', 'em implantação', 'implantada', 'reprovada'];
const STATUS_CSS = {
  'rascunho': 'rascunho', 'pendente': 'pendente', 'em avaliação inicial': 'avaliacao-inicial',
  'em avaliação de negócio': 'avaliacao-de-negocio', 'aguardando resposta do idealizador': 'aguardando',
  'em implantação': 'implantacao', 'implantada': 'implantada', 'reprovada': 'reprovada'
};
const STATUS_EDITAVEIS = ['pendente', 'em avaliação inicial', 'em avaliação de negócio', 'em implantação'];
const LANES = ['PARA FAZER', 'EM PROGRESSO', 'PARA AVALIAR', 'EM AVALIAÇÃO', 'FINALIZADO'];
const PRIORIDADE = ['', 'Baixa', 'Média', 'Alta'];
const CAROUSEL_IMGS = [
  'https://images.unsplash.com/photo-1493612276216-ee3925520721?w=1200',
  'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200',
  'https://images.unsplash.com/photo-1553877522-43269d4ea984?w=1200'
];
const QUOTES = [
  'Toda grande mudança começa com uma ideia.',
  'A inovação distingue líderes de seguidores.',
  'Ideias pequenas, quando compartilhadas, movem o mundo.',
  'O futuro pertence a quem ousa propor.'
];
const PAGE_SIZE = 15;
const PRAZO_AVALIACAO_DIAS = 5; /* dias parada em avaliação até o lembrete ao aprovador e o destaque de atraso */
const STATUS_AVALIACAO = ['pendente', 'em avaliação inicial', 'em avaliação de negócio'];
const STATUS_FIM = ['em implantação', 'implantada', 'reprovada'];

/* =========================== 2. UTILITÁRIOS ============================= */
const $ = s => document.querySelector(s);
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => {
  try { return decodeURIComponent(escape(atob(String(s).trim().replace(/\s/g, '')))).trim(); }
  catch (e) { return String(s ?? '').trim(); }
};
function parseLooseJson(text) {
  const t = String(text ?? '').trim();
  if (!t) return [];
  try { return JSON.parse(t); } catch (e) { }
  const fixed = t
    .replace(/([^,{\[\s])(\s*\n\s*)(?=")/g, '$1,$2')
    .replace(/\}(\s*\n\s*)(?=\{)/g, '},$1')
    .replace(/,(\s*[}\]])/g, '$1');
  return JSON.parse(fixed);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const semAcento = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const toList = v => (Array.isArray(v) ? v : typeof v == 'string' ? v.split(',') : []).map(x => String(x ?? '').trim()).filter(Boolean);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtIso = s => { const p = String(s || '').split('-'); return p.length == 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
const diasDesde = s => (Date.now() - parseDate(s)) / 86400000;

function showToast(msg, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
  t.innerHTML = `<span>${icon} ${esc(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 4000);
}

function showConfirm(texto, onConfirm) {
  openModal(`
    <h3>Confirmação</h3><br>
    <p style="margin-bottom:18px;">${esc(texto)}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn r" onclick="closeM()">Cancelar</button>
      <button class="btn" id="cfBtn">Confirmar</button>
    </div>`);
  $('#cfBtn').onclick = () => { closeM(); onConfirm(); };
}

function now() {
  const d = new Date();
  return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseDate(s) {
  const [a, b] = String(s || '').trim().split(/[ T]/);
  const p = (a || '').split(/[-\/]/);
  const [d, m, y] = p[0].length == 4 ? [p[2], p[1], p[0]] : p;
  return new Date(`${y}-${pad(m)}-${pad(d)}T${b || '00:00'}`);
}

async function discoverGist(t) {
  try {
    gistList = gistList || fetch('https://api.github.com/gists?per_page=100', { headers: authHeaders(), cache: 'no-store' })
      .then(r => r.ok ? r.json() : []);

  };

function toArray(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data == 'object') {
    const lista = Object.values(data).find(v => Array.isArray(v));
    if (lista) return lista;
    const vals = Object.values(data);
    if (vals.length && vals.every(v => v && typeof v == 'object')) return vals;
  }
  return null;
}

const LOAD_ERR = {};

async function loadTable(t) {
  delete LOAD_ERR[t];
  const id = gistId(t) || (META[t] && META[t].id) || await discoverGist(t);
  if (!id) return null;
  try {
    const r = await fetch('https://api.github.com/gists/' + id, { headers: authHeaders(), cache: 'no-store' });
    if (!r.ok) { LOAD_ERR[t] = 'o GitHub respondeu ' + r.status; return null; }
    const g = await r.json();
    const file = Object.keys(g.files)[0];
    if (!file) { LOAD_ERR[t] = 'o gist não tem arquivos'; return null; }
    META[t] = { id, file };
    let text = g.files[file].content;
    if (g.files[file].truncated) text = await (await fetch(g.files[file].raw_url, { cache: 'no-store' })).text();
    let data;
    try { data = parseLooseJson(text); }
    catch (e) { LOAD_ERR[t] = 'JSON inválido (' + e.message + ')'; return null; }
    const lista = toArray(data);
    if (!lista) LOAD_ERR[t] = 'o conteúdo não é uma lista';
    return lista;
  } catch (e) { LOAD_ERR[t] = 'sem conexão com o GitHub'; return null; }
}

const firstOf = (o, ...ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; return ''; };
const toBool = v => v === true || ['true', 'sim', 'yes', '1'].includes(String(v).trim().toLowerCase());
function normalizeIdea(i, k) {
  i = i && typeof i == 'object' ? i : {};
  const emailusuario = String(firstOf(i, 'emailusuario', 'email', 'emailautor')).trim();
  return {

    programaideia: firstOf(i, 'programaideia', 'campanha', 'programa'),
    beneficio: firstOf(i, 'beneficio'),
    data: firstOf(i, 'data', 'datacriacao', 'datacadastro'),
    dataconclusao: firstOf(i, 'dataconclusao'),

    privada: toBool(i.privada),

    tags: toList(i.tags),

    historico: (Array.isArray(i.historico) ? i.historico : []).filter(h => h && typeof h == 'object')
  };
}

function normalizeBoard(b) {
  if (!b || typeof b != 'object' || (!('aplicacaocard' in b) && !('board' in b))) return b;
  return {
    ...b,
    board: String(b.board || ''),
    datacriacao: b.datacriacao || '',
    emailautorcriacao: String(b.emailautorcriacao || '').trim(),
    usuarios: (Array.isArray(b.usuarios) ? b.usuarios : [])
      .map(u => ({ email: String((u && u.email) || (typeof u == 'string' ? u : '')).trim() })).filter(u => u.email),
    aplicacaocard: (Array.isArray(b.aplicacaocard) ? b.aplicacaocard : []).map(normalizeCard)
  };
}

function mergeBoard(local, remote, snapJson) {
  if (!Array.isArray(local.aplicacaocard) || !Array.isArray(remote.aplicacaocard))
    return JSON.stringify(local) === snapJson ? remote : local;
  const snap = snapJson ? JSON.parse(snapJson) : { aplicacaocard: [] };
  const sc = new Map((snap.aplicacaocard || []).map(c => [String(c.id), JSON.stringify(c)]));
  const rc = new Map(remote.aplicacaocard.map(c => [String(c.id), c]));
  const lc = new Set(local.aplicacaocard.map(c => String(c.id)));
  const cards = [];
  local.aplicacaocard.forEach(c => {
    const id = String(c.id);
    if (!sc.has(id) || JSON.stringify(c) !== sc.get(id)) cards.push(c);
    else if (rc.has(id)) cards.push(rc.get(id));
  });
  remote.aplicacaocard.forEach(r => { const id = String(r.id); if (!lc.has(id) && !sc.has(id)) cards.push(r); });
  const semCards = o => JSON.stringify({ ...o, aplicacaocard: 0 });
  const base = semCards(local) === semCards(snap) ? remote : local;
  return { ...base, aplicacaocard: cards };
}

function normalizeCard(c, k) {
  c = c && typeof c == 'object' ? c : {};
  return { ...c, id: Number(c.id) || 200000 + k, prioridade: Number(c.prioridade) || 1,
           status: LANES.includes(c.status) ? c.status : LANES[0] };
}

function metaPct(subs) {
  return subs.length ? Math.round(subs.filter(x => x.concluida).length * 100 / subs.length) : 0;
}
function normalizeMeta(m) {
  m = m && typeof m == 'object' ? m : {};
  const submeta = (Array.isArray(m.submeta) ? m.submeta : []).map(x => ({
    ...(x && typeof x == 'object' ? x : {}),
    descricao: String((x && x.descricao) || ''),
    concluida: toBool(x && x.concluida),
    responsavel: String((x && x.responsavel) || '').trim(),
    concluidaPor: String((x && x.concluidaPor) || '').trim()
  }));
  const usuarios = (Array.isArray(m.usuarios) ? m.usuarios : [])
    .map(u => ({ email: String((u && u.email) || (typeof u == 'string' ? u : '')).trim() }))
    .filter(u => u.email);
  return { ...m, meta: String(m.meta || ''), autor: String(m.autor || '').trim(),
           campanha: String(m.campanha || ''), alvo: Number(m.alvo) || 0, avisoVencida: m.avisoVencida || '',
           dataCriacao: m.dataCriacao || '', dataPrevisaoConclusao: m.dataPrevisaoConclusao || '',
           submeta, usuarios, porcentagemConclusao: metaPct(submeta) };
}

const SYNC = {
  metas:       { key: m => [m.meta, m.dataCriacao, m.autor].join('|'), norm: l => l.map(normalizeMeta) },
  comentarioscard: { key: c => [c.idcardaplicacao, c.autorcomentario, c.data, c.comentario].join('|'), norm: l => l },
  ideias:      { key: i => String(i.id), norm: l => l.map(normalizeIdea) },
  curtidas:    { key: c => c.idideia + '|' + c.autorcurtida, norm: l => l },
  comentarios: { key: c => [c.idideia, c.autorcomentario, c.data, c.comentario].join('|'), norm: l => l },
  cards:       { key: b => [b.board, b.datacriacao, b.emailautorcriacao].join('|'), norm: l => l.map(normalizeBoard), merge: mergeBoard }
};

async function refreshData() {
  let changed = false;
  for (const t of Object.keys(SYNC)) {
    if (dirty.has(t)) continue;
    const lista = await loadTable(t);
    if (!lista) continue;
    const nova = SYNC[t].norm(lista);
    if (JSON.stringify(nova) !== JSON.stringify(DB[t])) { DB[t] = nova; changed = true; }
    snapshot(t);
  }
  return changed;
}

async function mergeRemote(t) {
  const sy = SYNC[t];
  const remoto = await loadTable(t);
  if (!remoto) return;
  const snap = SNAP[t] || new Map();
  const pos = new Map(DB[t].map((x, k) => [sy.key(x), k]));
  sy.norm(remoto).forEach(r => {
    const k = sy.key(r), at = pos.get(k);
    if (at === undefined) { if (!snap.has(k)) DB[t].push(r); }
    else if (sy.merge) DB[t][at] = sy.merge(DB[t][at], r, snap.get(k));
    else if (JSON.stringify(DB[t][at]) === snap.get(k)) DB[t][at] = r;
  });
}

function save(...tables) {
  tables.forEach(t => dirty.add(t));
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

async function writeTable(t) {
  if (!META[t]) await (gistId(t) ? resolveFixedGist(t) : createGist(t));
  if (SYNC[t]) await mergeRemote(t);
  const r = await fetch('https://api.github.com/gists/' + META[t].id, {
    method: 'PATCH', headers: jsonHeaders(),
    body: JSON.stringify({ files: { [META[t].file]: { content: JSON.stringify(DB[t], null, 1) } } })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  if (SYNC[t]) snapshot(t);
}

async function flush() {
  for (const t of [...dirty]) {
    try { await writeTable(t); dirty.delete(t); }
    catch (e) { console.warn('Falha ao gravar o gist "' + t + '":', e); }
  }
}

async function resolveFixedGist(t) {
  const r = await fetch('https://api.github.com/gists/' + gistId(t), { headers: authHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('Não foi possível acessar o gist de "' + t + '" (' + r.status + ').');
  const file = Object.keys((await r.json()).files)[0];
  if (!file) throw new Error('O gist de "' + t + '" não tem arquivos.');
  META[t] = { id: gistId(t), file };
}

async function createGist(t) {
  try {
    const l = await fetch('https://api.github.com/gists?per_page=100', { headers: authHeaders(), cache: 'no-store' });
    if (l.ok) {
      const g = (await l.json()).find(x => x.description == 'INSIGHT ' + t);
      if (g) { META[t] = { id: g.id, file: Object.keys(g.files)[0] }; return; }
    }
  } catch (e) { }
  const file = t + '.json';
  const r = await fetch('https://api.github.com/gists', {
    method: 'POST', headers: jsonHeaders(),
    body: JSON.stringify({ description: 'INSIGHT ' + t, public: false, files: { [file]: { content: '[]' } } })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const g = await r.json();
  META[t] = { id: g.id, file };
}

    { get: () => { const m = document.cookie.match(new RegExp('(?:^|; )' + KEY + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; },
      set: v => { document.cookie = KEY + '=' + encodeURIComponent(v) + '; max-age=31536000; path=/; SameSite=Strict'; },
      del: () => { document.cookie = KEY + '=; max-age=0; path=/'; } }
  ];
  return {
    save(email, senha) {
      const value = JSON.stringify({ email: String(email).trim(), senha: b64(senha) });
      let ok = false;
      backends.forEach(b => { safe(() => b.set(value)); if (safe(b.get) === value) ok = true; });
      return ok;
    },
    load() {
      for (const b of backends) {
        const raw = safe(b.get);
        if (!raw) continue;
        try {
          const l = JSON.parse(raw), senha = decodeSenha(l.senha);
          if (l.email && senha) return { email: l.email, senha };
        } catch (e) { }
      }
      return null;
    },
    clear() { backends.forEach(b => safe(b.del)); },
    purgeLegacy() { LEGACY.forEach(k => safe(() => localStorage.removeItem(k))); }
  };
})();

const sessao = (() => {

function decodeSenha(b64txt) {
  try { return decodeURIComponent(escape(atob(String(b64txt || '').trim()))); }
  catch (e) { return null; }
}

function sha256Js(bytes) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const K = [], H = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let pr = true;
    for (let d = 2; d * d <= n; d++) if (n % d == 0) { pr = false; break; }
    if (!pr) continue;
    if (c < 8) H[c] = (Math.sqrt(n) % 1) * 4294967296 | 0;
    K[c++] = (Math.cbrt(n) % 1) * 4294967296 | 0;
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(len * 8 / 4294967296));
  dv.setUint32(total - 4, (len * 8) >>> 0);
  for (let o = 0; o < total; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

async function sha256(txt) {
  const bytes = new TextEncoder().encode(String(txt));
  if (window.crypto && crypto.subtle) {
    try {
      const h = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { }
  }
  return sha256Js(bytes);
}

function aplicarSegredos(p) {
  LOGIN_PREFIX = p;
  GH_TOKEN = 'ghp_' + p[0] + GTM + p[1];
  USUARIOS_BUSCA_ID = USUARIOS_GIST_ID;
  USUARIOS_RAW = 'https://gist.githubusercontent.com/' + USUARIOS_GIST_DONO + '/' + USUARIOS_GIST_ID + '/raw';
}

async function passwordMatches(user, typed) {
  const hash = String(user.senha || '').trim().toLowerCase();
  const typedHash = (await sha256(typed)).toLowerCase();
  return hash === typedHash;
}

async function validarCredenciais(email, senha) {
  if (senha.length >= PREFIXO_LEN) aplicarSegredos(senha.slice(0, PREFIXO_LEN));

  const remotos = await fetchRemoteUsers();
  const lista = (remotos && Array.isArray(remotos) ? remotos : (DB.usuarios || [])).map(normalizeUser);
  const found = lista.find(u => u.email.toLowerCase() == email);

  // Compara diretamente o SHA-256 da senha digitada com a hash guardada no JSON
  if (!found || !(await passwordMatches(found, senha))) { limparSegredos(); return { erro: 'E-mail ou senha incorretos.' }; }
  if (!found.ativo) { limparSegredos(); return { erro: 'Usuário inativo. Fale com o administrador.' }; }
  return { user: syncUser(found) };
}

function syncUser(found) {
  let user = DB.usuarios.find(u => u.email.toLowerCase() == found.email.toLowerCase());
  if (user) Object.assign(user, found); else { DB.usuarios.push(found); user = found; }
  return user;
}

/* menções com @ */
const MN_LIST = {};
function mentionTokens() {
  const us = companyUsers().filter(u => u.ativo);
  const primeiros = {};
  us.forEach(u => { const f = String(u.nome || '').trim().split(/\s+/)[0].toLowerCase(); if (f) primeiros[f] = (primeiros[f] || 0) + 1; });
  const out = [];
  us.forEach(u => {
    const nome = String(u.nome || '').trim();
    if (nome) out.push({ tok: nome, email: u.email });
    const f = nome.split(/\s+/)[0];
    if (f && f != nome && primeiros[f.toLowerCase()] == 1) out.push({ tok: f, email: u.email });
  });
  return out.sort((a, b) => b.tok.length - a.tok.length);
}
function mentionedEmails(texto) {
  const out = new Set();
  mentionTokens().forEach(({ tok, email }) => {
    if (sameEmail(email, ME.email) || out.has(email)) return;
    if (new RegExp('@' + escRe(tok) + '(?![\\p{L}\\p{N}_])', 'iu').test(String(texto))) out.add(email);
  });
  return [...out];
}
function fmtComent(texto) {
  const h = esc(texto), t = mentionTokens();
  if (!t.length) return h;
  const re = new RegExp('@(' + t.map(x => escRe(esc(x.tok))).join('|') + ')(?![\\p{L}\\p{N}_])', 'giu');
  return h.replace(re, m => `<span class="men">${m}</span>`);
}
function notifMencoes(texto, onde, extra) {
  return mentionedEmails(texto).map(e => ({ tipo: 'mencao', destinoEmail: e, titulo: 'Você foi citado em um comentário',
    mensagem: `${ME.nome} citou você em um comentário ${onde}.`, ...extra }));
}
function mentionSuggest(el) {

  if (!box) return;
  const m = /(^|\s)@([^\s@]{0,30})$/.exec(el.value.slice(0, el.selectionStart));
  if (!m) { box.classList.remove('on'); box.innerHTML = ''; return; }
  const q = semAcento(m[2]);
  const us = companyUsers().filter(u => u.ativo && !sameEmail(u.email, ME.email) && semAcento(u.nome).includes(q)).slice(0, 5);
  MN_LIST[el.id] = us.map(u => u.nome);

}
function pickMention(id, k) {
  const el = document.getElementById(id), nome = (MN_LIST[id] || [])[k];
  if (!el || !nome) return;
  const pos = el.selectionStart;
  const antes = el.value.slice(0, pos).replace(/@[^\s@]*$/, '@' + nome + ' ');
  el.value = antes + el.value.slice(pos);
  el.focus();
  el.setSelectionRange(antes.length, antes.length);
  const box = document.getElementById('mn_' + id);
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
}

  const coaut = (i.coautores || []).length ? ` · Coautores: ${i.coautores.map(e => esc(getUser(e).nome)).join(', ')}` : '';

  const impl = base.filter(i => i.status == 'implantada').length;

  const total = impl + repr;
  const R = 54, C = 2 * Math.PI * R;
  const aImpl = total ? C * impl / total : 0;
  const aRepr = total ? C * repr / total : 0;
  const pct = total ? Math.round(impl * 100 / total) : 0;
  return `
    <div class="indic">
      <div class="donut">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#3a3f46" stroke-width="18"></circle>
          ${total ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#2f80ff" stroke-width="18" stroke-dasharray="${aImpl} ${C - aImpl}"></circle>
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#e53935" stroke-width="18" stroke-dasharray="${aRepr} ${C - aRepr}" stroke-dashoffset="${-aImpl}"></circle>` : ''}
        </svg>
        <div class="ct"><b>${total ? pct + '%' : '-'}</b><small>implantadas</small></div>
      </div>
      <div>
        <h3>Indicador: implantadas x reprovadas</h3>

    </div>`;

/* sugestão de ideias parecidas */
function ideiasSimilares(titulo, idAtual) {
  const stop = new Set(['para', 'com', 'uma', 'das', 'dos', 'que', 'por', 'mais', 'como', 'sem', 'nas', 'nos', 'pelo', 'pela', 'ser', 'sua', 'seu']);
  const toks = t => new Set(semAcento(t).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stop.has(w)).map(w => w.slice(0, 5)));
  const a = toks(titulo), tNorm = semAcento(titulo).trim();
  if (!a.size || tNorm.length < 3) return [];
  return companyIdeas()
    .filter(i => i.id != idAtual && (!i.privada || sameEmail(i.emailusuario, ME.email)) && (i.status != 'rascunho' || sameEmail(i.emailusuario, ME.email)))
    .map(i => {
      const b = toks(i.titulo);
      const inter = [...a].filter(w => b.has(w)).length, uni = new Set([...a, ...b]).size;
      return { i, score: uni ? inter / uni : 0, sub: tNorm.length >= 4 && semAcento(i.titulo).includes(tNorm) };
    })
    .filter(x => x.score >= 0.34 || x.sub)
    .sort((x, y) => y.score - x.score).slice(0, 4).map(x => x.i);
}
function showSimilar(idAtual) {
  const el = $('#fdup'); if (!el) return;
  const lista = ideiasSimilares($('#f1').value, idAtual);
  el.innerHTML = lista.length ? `<div class="dup"><b>⚠ Ideias parecidas já cadastradas:</b>
    ${lista.map(i => `<div>• ${esc(i.titulo)} <small>(${esc(i.status)} · ${esc(getUser(i.emailusuario).nome)})</small></div>`).join('')}</div>` : '';
}

async function saveIdea(id, status) {
  const titulo = $('#f1').value.trim(), descricao = $('#f2').value.trim(), aprovador = $('#f5').value;
  if (!titulo || !descricao || !aprovador || !$('#f3').value)
    return $('#fm').textContent = 'Preencha título, descrição, campanha e aprovador.';

  const antiga = DB.ideias.find(x => x.id == id);
  const prog = companyPrograms().find(p => p.programaideia == $('#f3').value);
  if (prog && campanhaEncerrada(prog) && (!antiga || antiga.programaideia != prog.programaideia))
    return $('#fm').textContent = 'Esta campanha já foi encerrada.';

  const isNew = !id;
  const idea = antiga ||
    { id: Date.now(), empresa: ME.empresa, emailusuario: ME.email, data: now(), dataconclusao: '', parecer: '', historico: [] };
  const statusAntigo = idea.status;
  const tags = [...new Set(toList($('#f7').value).map(t => t.toLowerCase().replace(/^#/, '')).filter(Boolean))].slice(0, 8);
  const coautores = [...document.querySelectorAll('#fco input:checked')].map(x => x.value);

  Object.assign(idea, { titulo, descricao, programaideia: $('#f3').value, beneficio: $('#f4').value,
    emailaprovador: aprovador, privada: $('#f6').checked, status, tags, coautores, anexos: [...ANEXOS_TMP] });
  if (!Array.isArray(idea.historico)) idea.historico = [];
  if (statusAntigo !== status) addHist(idea, statusAntigo || '', status, '');

  if (isNew) DB.ideias.push(idea);

  if (status === 'pendente') {
    pushNotification({
      tipo: 'ideia_enviada',
      destinoEmail: aprovador,
      titulo: 'Nova ideia recebida para avaliação',
      mensagem: `A ideia "${titulo}" foi enviada para sua aprovação por ${ME.nome}.`,
      idideia: idea.id
    });
  }

  ANEXOS_TMP = [];
  save('ideias'); closeM(); render();
  showToast(isNew ? 'Ideia salva com sucesso!' : 'Ideia atualizada com sucesso!');
}

async function saveEval(id) {
  const i = DB.ideias.find(x => x.id == id);
  const statusAntigo = i.status;
  const parecerAntigo = i.parecer;

  i.status = $('#e1').value;
  i.parecer = $('#e2').value;
  if (['implantada', 'reprovada'].includes(i.status)) i.dataconclusao = now();

  if (statusAntigo !== i.status || parecerAntigo !== i.parecer) {
    addHist(i, statusAntigo, i.status, i.parecer);
    pushNotification({
      tipo: 'ideia_atualizada',
      destinoEmail: i.emailusuario,
      titulo: 'Sua ideia teve atualizações',
      mensagem: `Sua ideia "${i.titulo}" teve o status alterado para "${i.status}" ou recebeu um novo parecer pelo aprovador.`,
      idideia: i.id
    });
  }

  save('ideias'); closeM(); render();
  showToast(i.status == 'em implantação' && statusAntigo != i.status
    ? 'Status atualizado! Use "Criar card" na ideia para levá-la a um board.' : 'Avaliação/Status atualizados!');
}

function createCardFromIdea(id) {
  const i = DB.ideias.find(x => x.id == id);
  const b = DB.cards.find(x => isBoard(x) && boardKey(x) == $('#ic1').value);
  const nome = $('#ic2').value.trim();

  if (!nome) return $('#icm').textContent = 'Informe o título do card.';
  const avaliador = b.usuarios.some(m => sameEmail(m.email, i.emailaprovador)) ? i.emailaprovador : ME.email;
  const c = { id: Date.now(), empresa: ME.empresa, data: now(), cardnome: nome, descricao: $('#ic3').value.trim(),
    emailautor: ME.email, emailavaliador: avaliador, status: LANES[0], prioridade: 2, prazo: $('#ic4').value, idideia: i.id };
  b.aplicacaocard.push(c);
  i.idcard = { key: boardKey(b), board: b.board, idcard: c.id };
  if (!sameEmail(avaliador, ME.email))
    pushNotification({ tipo: 'avaliador_card', destinoEmail: avaliador, titulo: 'Você é avaliador de um card',
      mensagem: `${ME.nome} criou o card "${c.cardnome}" no board "${b.board}" e definiu você como avaliador.` });
  save('cards', 'ideias'); closeM(); render();
  showToast(`Card criado no board "${b.board}"!`);
}

/* ---- indicadores (aprovadores) e exportação ---- */
function tempoAvaliacaoDias(i) {
  if (!STATUS_FIM.includes(i.status)) return null;
  const hs = i.historico || [];
  const hIni = hs.find(x => x.para == 'pendente'), hFim = hs.find(x => STATUS_FIM.includes(x.para));
  const ini = parseDate(hIni ? hIni.data : i.data);
  const fim = hFim ? parseDate(hFim.data) : (i.dataconclusao ? parseDate(i.dataconclusao) : null);
  if (!fim || isNaN(ini) || isNaN(fim)) return null;
  return Math.max(0, (fim - ini) / 86400000);
}

const barrasHtml = rows => {
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="brow"><span class="bl" title="${esc(r.l)}">${esc(r.l)}</span><div class="bt"><div style="width:${r.v * 100 / max}%"></div></div><b>${r.v}</b></div>`).join('');
};

function viewIndicadores() {
  if (!isApprover()) return '<div class="wrap one"><div class="box">Acesso restrito a aprovadores.</div></div>';
  const base = ideiasBaseTodas().filter(i => i.status != 'rascunho');
  const aprov = base.filter(i => ['em implantação', 'implantada'].includes(i.status)).length;
  const repr = base.filter(i => i.status == 'reprovada').length;
  const taxa = aprov + repr ? Math.round(aprov * 100 / (aprov + repr)) : null;
  const tempos = base.map(tempoAvaliacaoDias).filter(x => x != null);
  const medio = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;
  const emAvaliacao = base.filter(i => STATUS_AVALIACAO.includes(i.status));
  const atrasadas = emAvaliacao.filter(ideaAtrasada).length;

  const hoje = new Date(), meses = [];
  for (let k = 11; k >= 0; k--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - k, 1);
    meses.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
  }
  const porMes = meses.map(m => ({ l: rotuloMes(m), v: base.filter(i => mesDe(i) == m).length }));
  const camp = {};
  base.forEach(i => { const c = i.programaideia || '(sem campanha)'; camp[c] = (camp[c] || 0) + 1; });
  const topCamp = Object.entries(camp).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([l, v]) => ({ l, v }));

  return `
  <div class="wrap one"><div>
    <h2>Indicadores</h2><br>
    <div class="feats">
      <div class="box"><div class="kpi">${base.length}</div><p class="meta">ideias enviadas</p></div>
      <div class="box"><div class="kpi">${taxa == null ? '-' : taxa + '%'}</div><p class="meta">taxa de aprovação (em implantação + implantadas ÷ decididas)</p></div>
      <div class="box"><div class="kpi">${medio == null ? '-' : medio.toFixed(1).replace('.', ',') + ' d'}</div><p class="meta">tempo médio de avaliação</p></div>
      <div class="box ${atrasadas ? 'late' : ''}"><div class="kpi" style="${atrasadas ? 'color:#ff6b6b' : ''}">${atrasadas}</div><p class="meta">ideias atrasadas na avaliação (de ${emAvaliacao.length} em avaliação · prazo ${PRAZO_AVALIACAO_DIAS} dias)</p></div>
    </div>
    <div class="box"><h3 style="color:var(--g);margin-bottom:8px">Ideias por mês</h3>${barrasHtml(porMes)}</div>
    <div class="box"><h3 style="color:var(--g);margin-bottom:8px">Campanhas mais ativas</h3>${topCamp.length ? barrasHtml(topCamp) : '<p class="meta">Sem dados.</p>'}</div>
    <div class="box">${indicadorHtml(base)}</div>
  </div></div>`;
}

function exportarCsv() {
  const list = byNewest(filtraTodas(false));
  if (!list.length) return showToast('Nenhuma ideia para exportar com os filtros atuais.', 'warning');
  const cols = [
    ['ID', i => i.id], ['Título', i => i.titulo], ['Descrição', i => i.descricao],
    ['Autor', i => getUser(i.emailusuario).nome], ['E-mail do autor', i => i.emailusuario],
    ['Coautores', i => (i.coautores || []).map(e => getUser(e).nome).join(', ')],
    ['Campanha', i => i.programaideia], ['Benefício', i => i.beneficio], ['Tags', i => (i.tags || []).join(', ')],
    ['Aprovador', i => getUser(i.emailaprovador).nome], ['Status', i => i.status],
    ['Data', i => i.data], ['Conclusão', i => i.dataconclusao], ['Parecer', i => i.parecer],
    ['Curtidas', i => ideaLikes(i).length], ['Comentários', i => ideaComments(i).length],
    ['Privada', i => i.privada ? 'Sim' : 'Não']
  ];
  const cel = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
  const csv = '\ufeff' + [cols.map(c => cel(c[0])).join(';'), ...list.map(i => cols.map(c => cel(c[1](i))).join(';'))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ideias_${todayIso()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast(`${list.length} ideia(s) exportada(s).`);
}

function formatDate(s) {
  if (!s) return '';
  if (s.includes('T') || s.includes('-')) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
    }
  }
  return s;
}

async function patchUsersGist(lista) {
  if (!GH_TOKEN) throw new Error('Não foi possível concluir a operação. Tente novamente.');
  const headers = jsonHeaders();
  let file = META.usuarios && META.usuarios.file;
  if (!file) {
    const g = await fetch('https://api.github.com/gists/' + GISTS.usuarios, { headers, cache: 'no-store' });
    if (!g.ok) throw new Error('Não foi possível concluir a operação. Tente novamente.');
    file = Object.keys((await g.json()).files)[0];
    META.usuarios = { id: GISTS.usuarios, file };
  }
  const r = await fetch('https://api.github.com/gists/' + GISTS.usuarios, {
    method: 'PATCH', headers,
    body: JSON.stringify({ files: { [file]: { content: JSON.stringify(lista, null, 2) } } })
  });
  if (!r.ok) throw new Error('Não foi possível salvar. Tente novamente.');
}

let REMOTE_PROGRAMAS = [];
let REMOTE_PROGRAMAS_FILENAME = 'programas.json';

async function fetchRemoteProgramas() {
  const targetId = GISTS.programas || '2b36bffaed668f45ee2ca85765430cd3';
  const url = `https://api.github.com/gists/${targetId}?t=${Date.now()}`;
  const response = await fetch(url, {
    headers: { Authorization: 'token ' + GH_TOKEN },
    cache: 'no-store'
  });
  if (!response.ok) throw new Error('Não foi possível carregar os programas do Gist (' + response.status + ').');
  const gistData = await response.json();
  const fileName = Object.keys(gistData.files)[0] || 'programas.json';
  REMOTE_PROGRAMAS_FILENAME = fileName;
  const fileObj = gistData.files[fileName];
  let contentText = fileObj.content;
  if (fileObj.truncated && fileObj.raw_url) {
    const rawRes = await fetch(fileObj.raw_url, { cache: 'no-store' });
    contentText = await rawRes.text();
  }
  const parsed = parseLooseJson(contentText);
  return Array.isArray(parsed) ? parsed : [];
}

async function updateRemoteProgramas(listaNova) {
  const targetId = GISTS.programas || '2b36bffaed668f45ee2ca85765430cd3';
  const url = `https://api.github.com/gists/${targetId}`;
  const response = await fetch(url, {
    method: 'PATCH',
    headers: {
      Authorization: 'token ' + GH_TOKEN,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      files: {
        [REMOTE_PROGRAMAS_FILENAME]: {
          content: JSON.stringify(listaNova, null, 2)
        }
      }
    })
  });
  if (!response.ok) throw new Error('Falha ao atualizar o Gist no GitHub (' + response.status + ').');
}

function saveProgram(antigo) {
  const titulo = $('#g1').value.trim();
  const descricao = $('#g2').value.trim();
  const criterio = $('#g3').value.trim();
  const inicio = $('#g4').value, fim = $('#g5').value;
  if (!titulo) return $('#gm').textContent = 'O título é obrigatório.';
  if (inicio && fim && fim < inicio) return $('#gm').textContent = 'O fim não pode ser anterior ao início.';

  const p = companyPrograms().find(x => x.programaideia == antigo);
  if (p) {
    if (antigo !== titulo) {
      companyIdeas().filter(i => i.programaideia == antigo).forEach(i => i.programaideia = titulo);
      save('ideias');
    }
    Object.assign(p, { programaideia: titulo, descricao, criterio, inicio, fim });
    save('programas');
  } else {
    DB.programas.push({
      programaideia: titulo,
      empresa: ME.empresa,
      descricao,
      criterio,
      inicio,
      fim,
      emailautor: ME.email
    });
    save('programas');
  }
  closeM();
  render();
}

function deleteProgram(nome) {
  const temIdeias = companyIdeas().some(i => i.programaideia == nome);
  if (temIdeias) {
    showToast('Há ideias vinculadas a esta campanha. Não é possível excluir.');
    return;
  }

  showConfirm(`Deseja realmente excluir a campanha "${nome}"?`, () => {
    const idx = DB.programas.findIndex(p => p.programaideia == nome && p.empresa == ME.empresa);
    if (idx >= 0) {
      DB.programas.splice(idx, 1);
      save('programas');
      render();
    }
  });
}
