<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSIGHT - Plataforma de ideias</title>
<style>
:root {
  --bg:#1b1d20;
  --bg2:#26292e;
  --bg3:#31353b;
  --fg:#fff;
  --mut:#a9afb8;
  --g:#10b981;
  --gd:#1f9e0a
}
* {
  box-sizing:border-box;
  margin:0
}
body {
  font-family:"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  padding-bottom:80px
}
button,input,select,textarea {
  font:inherit
}
a {
  color:var(--g)
}
.btn {
  background:var(--g);
  color:#111;
  border:0;
  padding:10px 18px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.2s
}
.btn:hover {
  box-shadow:0 0 16px var(--g);
  transform:translateY(-1px)
}
.btn.o {
  background:none;
  color:var(--g);
  border:1px solid var(--g)
}
.btn.r {
  background:#444850;
  color:#fff;
  border:1px solid #555b66
}
.btn.r:hover {
  background:#525863;
  box-shadow:0 0 12px rgba(255,255,255,0.1)
}
.btn.s {
  padding:5px 11px;
  font-size:.85rem
}
input,select,textarea {
  width:100%;
  background:var(--bg3);
  border:1px solid #444;
  color:#fff;
  padding:10px;
  border-radius:10px;
  margin:4px 0 10px
}
input:focus,select:focus,textarea:focus {
  outline:0;
  border-color:var(--g);
  box-shadow:0 0 0 2px #39ff1433
}
input[readonly],textarea[readonly] {
  opacity:.6
}
input[type=checkbox] {
  width:auto;
  margin-right:6px
}
label {
  font-size:.85rem;
  color:var(--mut)
}
header {
  position:sticky;
  top:0;
  z-index:50;
  background:#14161899;
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--g);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 20px
}
header img {
  height:44px;
  cursor:pointer;
  border-radius:12px
}
header.hc {
  display:grid;
  grid-template-columns:1fr auto 1fr
}
header.hc .menu {
  justify-self:end
}
.menu {
  position:relative
}
.drop {
  display:none;
  position:absolute;
  right:0;
  top:46px;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:12px;
  min-width:230px;
  overflow:hidden;
  box-shadow:0 10px 30px #000a
}
.drop.on {
  display:block
}
.drop a {
  display:block;
  padding:11px 16px;
  color:#fff;
  text-decoration:none;
  cursor:pointer
}
.drop a:hover {
  background:var(--g);
  color:#111
}
.wrap {
  max-width:1150px;
  margin:20px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 290px;
  gap:20px
}
.wrap.one {
  grid-template-columns:1fr
}
.box {
  background:var(--bg2);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  border:1px solid #3a3f46
}
.idea {
  border-left:4px solid var(--g)
}
.idea h3 {
  color:var(--g);
  margin-bottom:6px
}
.meta {
  color:var(--mut);
  font-size:.82rem;
  margin:6px 0
}
.badge {
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:700;
  color:#111
}
.s-rascunho { background:#888 }
.s-pendente,.s-avaliacao-inicial,.s-avaliacao-de-negocio { background:#a6ffa0 }
.s-aguardando { background:#ffd93b }
.s-implantacao { background:#1b8a3a; color:#fff }
.s-implantada { background:#2f80ff; color:#fff }
.s-reprovada { background:#e53935; color:#fff }

.act button {
  background:none;
  border:1px solid #555;
  color:#fff;
  border-radius:20px;
  padding:4px 12px;
  cursor:pointer;
  margin-right:6px
}
.act button.on {
  border-color:var(--g);
  color:var(--g)
}
.cm {
  background:var(--bg3);
  border-radius:10px;
  padding:8px 12px;
  margin:6px 0;
  font-size:.9rem
}
.cm small {
  color:var(--mut)
}
.row {
  display:flex;
  gap:8px
}
.row input {
  margin-bottom:0
}
.av {
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--g);
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex:none
}
.sc {
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #3a3f46
}
.sc b {
  margin-left:auto;
  color:var(--g)
}
.car {
  position:relative;
  height:260px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:12px
}
.car img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:.8s
}
.car img.on {
  opacity:1
}
.car button {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:#000a;
  color:var(--g);
  border:0;
  font-size:1.6rem;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.4)
}
.car button span {
  display:inline-block;
  margin-top:-3px
}
.dots {
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center
}
.dots i {
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff6;
  margin:0 4px;
  cursor:pointer
}
.dots i.on {
  background:var(--g)
}
.quote {
  text-align:center;
  font-style:italic;
  color:var(--mut);
  padding:8px 0 18px
}
.fab {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#141618f0;
  border-top:1px solid var(--g);
  padding:12px;
  text-align:center;
  z-index:40
}
#modal {
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:90;
  overflow:auto;
  padding:20px
}
#modal.on {
  display:block
}
#modal>div {
  max-width:560px;
  margin:auto;
  background:var(--bg2);
  border:1px solid var(--g);
  border-radius:18px;
  padding:22px
}
.login {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:radial-gradient(circle at 20% 10%,#1f3a1a,var(--bg) 55%)
}
.login .box {
  width:100%;
  max-width:400px;
  text-align:center
}
.login img {
  height:70px;
  margin-bottom:10px;
  border-radius:12px
}
.cta {
  display:block;
  margin-top:14px;
  padding:13px;
  border-radius:30px;
  background:linear-gradient(90deg,var(--g),#b6ff3b);
  color:#111;
  font-weight:800;
  text-decoration:none;
  box-shadow:0 0 22px #39ff1466
}
.doc {
  max-width:800px;
  margin:30px auto;
  padding:20px;
  line-height:1.7
}
.doc h1,.doc h2 {
  color:var(--g);
  margin:18px 0 8px
}
.board {
  display:grid;
  grid-template-columns:repeat(5,minmax(220px,1fr));
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px
}
.lane {
  background:var(--bg2);
  border-radius:14px;
  padding:10px;
  min-height:200px
}
.lane h4 {
  color:var(--g);
  margin-bottom:8px
}
.kc {
  background:var(--bg3);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  border-left:5px solid;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none
}
.kc .kh {
  float:right;
  margin:-4px -2px 0 8px;
  padding:2px 6px;
  color:var(--mut);
  font-size:1.1rem;
  line-height:1;
  touch-action:none;
  cursor:grab
}
.kc.dragging {
  opacity:.3
}
.kfloat {
  position:fixed;
  z-index:3000;
  margin:0;
  pointer-events:none;
  opacity:.95;
  transform:rotate(2deg);
  box-shadow:0 12px 32px rgba(0,0,0,.55)
}
.lane.over {
  outline:2px dashed var(--g);
  outline-offset:-2px
}
.kdrop {
  height:4px;
  border-radius:4px;
  background:var(--g);
  margin:0 0 8px
}
.p1 { border-color:#4caf50 }
.p2 { border-color:#ffd93b }
.p3 { border-color:#e53935 }
.msg { color:#ff6b6b; font-size:.85rem; min-height:18px }

/* Toast Notifications Container & Component */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
}
.toast {
  background: var(--bg2);
  color: var(--fg);
  border: 1px solid var(--g);
  padding: 14px 22px;
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.8);
  font-size: 0.92rem;
  font-weight: 600;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 420px;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.toast.warning {
  border-color: #ffd93b;
  background: #2b281d;
  color: #ffe885;
}
.toast.error {
  border-color: #e53935;
  background: #2d1d1f;
  color: #ff9e9e;
}

.filtros {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:0 12px;
  align-items:end
}
.filtros .btn { margin-bottom:10px }
.indic {
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap
}
.indic h3 { color:var(--g); margin-bottom:4px }
.donut { position:relative; width:140px; height:140px; flex:none }
.donut svg { width:100%; height:100%; transform:rotate(-90deg) }
.donut .ct {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.15
}
.donut .ct b { font-size:1.5rem }
.donut .ct small { color:var(--mut); font-size:.72rem }
.leg { display:flex; flex-direction:column; gap:8px }
.leg span { display:flex; align-items:center; gap:8px }
.leg i { width:12px; height:12px; border-radius:50%; display:inline-block }
.feats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin:12px 0
}
.feats .box { margin:0 }
.feats h3 { color:var(--g); font-size:1rem; margin-bottom:6px }
.steps { display:flex; flex-direction:column; gap:10px; margin:12px 0 }
.steps .st { display:flex; gap:12px; align-items:flex-start }
.steps .st p { margin:0 }
.doc ul { margin:8px 0 8px 22px }
.pbar { height:10px; border-radius:10px; background:#3a3f46; overflow:hidden; margin:8px 0 }
.pbar div { height:100%; background:var(--g); border-radius:10px; transition:.3s }
.kcm { max-height:150px; overflow:auto; margin-top:8px }
.kc input { user-select:text; -webkit-user-select:text }

@media (max-width:820px) {
  .wrap { grid-template-columns:1fr }
  .car { height:170px }
  header img { height:34px }
  #toast-container { left: 16px; right: 16px; bottom: 85px; }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0, 0, 0, 0.3);
  border-radius: 50%;
  border-top-color: #111;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast-container"></div>
<script>
/* =========================================================================
   INSIGHT - Plataforma de ideias
   Índice:  1 Config · 2 Utilitários · 3 Dados (Gists) · 4 Textos estáticos
            5 Autenticação · 6 Estrutura do app · 7 Ideias · 8 Perfil
            9 Campanhas · 10 Usuários · 11 Kanban · 12 Notificações · 13 Inicialização
   ========================================================================= */

/* ============================ 1. CONFIG ================================= */
const GISTS = {
  usuarios:    '9525a941c8117f69ccaa9963d0c0c966',
  perfis:      'dcbee6940580dfc7f28576ddb306bddf',
  cards:       'bfe6b21aedbd5d0de4dcd1d8fd225099',
  curtidas:    'da2793bb83bca6c161f8a6d82eef3cf1',
  comentarios: 'aa3c2342e360bb05300c870ae7f7c8c4',
  ideias:      '2b947e0b42aaacb61cddc29be00e17d0',
  empresas:    'e049dd6337764d33ae7770678e01a801',
  programas:   '2b36bffaed668f45ee2ca85765430cd3',
  notificacoes: 'fbd1dd1e8f9e8fa7821e3d7918f3ffb2',
  metas:        'ecf6297f014e1691492edc4673859235',
  comentarioscard: '8e8c4a719266fdc5693c2e1aab916921'
};
const TABLES = Object.keys(GISTS);
const PREFIXO_LEN = 4;
const GTM = 'QlGGY' + 'jPfBj4Noe3LgkuJLRDohc' + '9Z941iKt';
const USUARIOS_ID_PARCIAL = '833754c11631da39a6a2f53d62fe84';
let GH_TOKEN = '';
let USUARIOS_BUSCA_ID = '';
let USUARIOS_RAW = '';
let LOGIN_PREFIX = '';

function limparSegredos() { LOGIN_PREFIX = GH_TOKEN = USUARIOS_BUSCA_ID = USUARIOS_RAW = ''; }
async function tokenValido() {
  try { return (await fetch('https://api.github.com/gists/' + USUARIOS_BUSCA_ID, { headers: authHeaders(), cache: 'no-store' })).ok; }
  catch (e) { return false; }
}

const STATUS = ['rascunho', 'pendente', 'em avaliação inicial', 'em avaliação de negócio',
  'aguardando resposta do idealizador', 'em implantação', 'implantada', 'reprovada'];
const STATUS_CSS = {
  'rascunho': 'rascunho', 'pendente': 'pendente', 'em avaliação inicial': 'avaliacao-inicial',
  'em avaliação de negócio': 'avaliacao-de-negocio', 'aguardando resposta do idealizador': 'aguardando',
  'em implantação': 'implantacao', 'implantada': 'implantada', 'reprovada': 'reprovada'
};
const STATUS_EDITAVEIS = ['pendente', 'em avaliação inicial', 'em avaliação de negócio', 'em implantação'];
const LANES = ['PARA FAZER', 'EM PROGRESSO', 'PARA AVALIAR', 'EM AVALIAÇÃO', 'FINALIZADO'];
const PRIORIDADE = ['', 'Baixa', 'Média', 'Alta'];
const CAROUSEL_IMGS = [
  'https://images.unsplash.com/photo-1493612276216-ee3925520721?w=1200',
  'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200',
  'https://images.unsplash.com/photo-1553877522-43269d4ea984?w=1200'
];
const QUOTES = [
  'Toda grande mudança começa com uma ideia.',
  'A inovação distingue líderes de seguidores.',
  'Ideias pequenas, quando compartilhadas, movem o mundo.',
  'O futuro pertence a quem ousa propor.'
];
const PAGE_SIZE = 15;

/* =========================== 2. UTILITÁRIOS ============================= */
const $ = s => document.querySelector(s);
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => {
  try { return decodeURIComponent(escape(atob(String(s).trim().replace(/\s/g, '')))).trim(); }
  catch (e) { return String(s ?? '').trim(); }
};
function parseLooseJson(text) {
  const t = String(text ?? '').trim();
  if (!t) return [];
  try { return JSON.parse(t); } catch (e) { }
  const fixed = t
    .replace(/([^,{\[\s])(\s*\n\s*)(?=")/g, '$1,$2')
    .replace(/\}(\s*\n\s*)(?=\{)/g, '},$1')
    .replace(/,(\s*[}\]])/g, '$1');
  return JSON.parse(fixed);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');

function showToast(msg, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
  t.innerHTML = `<span>${icon} ${esc(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 4000);
}

function showConfirm(texto, onConfirm) {
  openModal(`
    <h3>Confirmação</h3><br>
    <p style="margin-bottom:18px;">${esc(texto)}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn r" onclick="closeM()">Cancelar</button>
      <button class="btn" id="cfBtn">Confirmar</button>
    </div>`);
  $('#cfBtn').onclick = () => { closeM(); onConfirm(); };
}

function now() {
  const d = new Date();
  return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function parseDate(s) {
  const [a, b] = String(s || '').trim().split(/[ T]/);
  const p = (a || '').split(/[-\/]/);
  const [d, m, y] = p[0].length == 4 ? [p[2], p[1], p[0]] : p;
  return new Date(`${y}-${pad(m)}-${pad(d)}T${b || '00:00'}`);
}
const byNewest = list => [...list].sort((x, y) => parseDate(y.data) - parseDate(x.data));
const logoImg = (attrs = '') =>
  `<img src="img/img2.png" alt="Logo" ${attrs} onerror="this.style.visibility='hidden'">`;
const optionList = (arr, sel) =>
  arr.map(x => `<option ${x == sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
const modalEl = () => document.getElementById('modal') ||
  document.body.appendChild(Object.assign(document.createElement('div'), { id: 'modal' }));
const openModal = html => { const m = modalEl(); m.innerHTML = '<div>' + html + '</div>'; m.classList.add('on'); };
const closeM = () => { const m = document.getElementById('modal'); if (m) m.classList.remove('on'); };

/* ============================ 3. DADOS (GISTS) ========================== */
let DB = {};
const META = {};
const dirty = new Set();
let flushTimer;

const gistId = t => GISTS[t] || '';
const authHeaders = () => GH_TOKEN ? { Authorization: 'token ' + GH_TOKEN } : {};
const jsonHeaders = () => ({ ...authHeaders(), 'Content-Type': 'application/json' });

let gistList;
async function discoverGist(t) {
  try {
    gistList = gistList || fetch('https://api.github.com/gists?per_page=100', { headers: authHeaders(), cache: 'no-store' })
      .then(r => r.ok ? r.json() : []);
    const g = (await gistList).find(x => x.description == 'INSIGHT ' + t);
    return g ? g.id : '';
  } catch (e) { return ''; }
}

function seedData() {
  return {
    perfis: [{ tipo: 'usuario_comum' }, { tipo: 'admin' }, { tipo: 'aprovador' }],
    empresas: [],
    usuarios: [], ideias: [], programas: [], comentarios: [], curtidas: [], cards: [], notificacoes: [], metas: [], comentarioscard: []
  };
}

function toArray(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data == 'object') {
    const lista = Object.values(data).find(v => Array.isArray(v));
    if (lista) return lista;
    const vals = Object.values(data);
    if (vals.length && vals.every(v => v && typeof v == 'object')) return vals;
  }
  return null;
}

const LOAD_ERR = {};

async function loadTable(t) {
  delete LOAD_ERR[t];
  const id = gistId(t) || (META[t] && META[t].id) || await discoverGist(t);
  if (!id) return null;
  try {
    const r = await fetch('https://api.github.com/gists/' + id, { headers: authHeaders(), cache: 'no-store' });
    if (!r.ok) { LOAD_ERR[t] = 'o GitHub respondeu ' + r.status; return null; }
    const g = await r.json();
    const file = Object.keys(g.files)[0];
    if (!file) { LOAD_ERR[t] = 'o gist não tem arquivos'; return null; }
    META[t] = { id, file };
    let text = g.files[file].content;
    if (g.files[file].truncated) text = await (await fetch(g.files[file].raw_url, { cache: 'no-store' })).text();
    let data;
    try { data = parseLooseJson(text); }
    catch (e) { LOAD_ERR[t] = 'JSON inválido (' + e.message + ')'; return null; }
    const lista = toArray(data);
    if (!lista) LOAD_ERR[t] = 'o conteúdo não é uma lista';

const toBool = v => v === true || ['true', 'sim', 'yes', '1'].includes(String(v).trim().toLowerCase());
function normalizeIdea(i, k) {

    programaideia: firstOf(i, 'programaideia', 'campanha', 'programa'),
    beneficio: firstOf(i, 'beneficio'),
    data: firstOf(i, 'data', 'datacriacao', 'datacadastro'),
    dataconclusao: firstOf(i, 'dataconclusao'),
    parecer: firstOf(i, 'parecer'),
    privada: toBool(i.privada),
    status: String(firstOf(i, 'status') || 'pendente').trim()
  };
}

function normalizeCard(c, k) {
  c = c && typeof c == 'object' ? c : {};
  return { ...c, id: Number(c.id) || 200000 + k, prioridade: Number(c.prioridade) || 1,
           status: LANES.includes(c.status) ? c.status : LANES[0] };
}

function metaPct(subs) {
  return subs.length ? Math.round(subs.filter(x => x.concluida).length * 100 / subs.length) : 0;
}
function normalizeMeta(m) {
  m = m && typeof m == 'object' ? m : {};
  const submeta = (Array.isArray(m.submeta) ? m.submeta : []).map(x => ({
    ...(x && typeof x == 'object' ? x : {}),
    descricao: String((x && x.descricao) || ''),
    concluida: toBool(x && x.concluida)
  }));
  const usuarios = (Array.isArray(m.usuarios) ? m.usuarios : [])
    .map(u => ({ email: String((u && u.email) || (typeof u == 'string' ? u : '')).trim() }))
    .filter(u => u.email);
  return { ...m, meta: String(m.meta || ''), autor: String(m.autor || '').trim(),
           dataCriacao: m.dataCriacao || '', dataPrevisaoConclusao: m.dataPrevisaoConclusao || '',
           submeta, usuarios, porcentagemConclusao: metaPct(submeta) };
}

const SYNC = {
  metas:       { key: m => [m.meta, m.dataCriacao, m.autor].join('|'), norm: l => l.map(normalizeMeta) },

  cards:       { key: c => String(c.id), norm: l => l.map(normalizeCard) }
};
const SNAP = {};
const snapshot = t => { SNAP[t] = new Map(DB[t].map(x => [SYNC[t].key(x), JSON.stringify(x)])); };

function normalizeData() {

async function loadAll() {
  const seed = seedData();
  const loaded = await Promise.all(TABLES.map(loadTable));
  gistOnline = loaded.some(x => x !== null);
  TABLES.forEach((t, k) => { DB[t] = loaded[k] !== null ? loaded[k] : seed[t]; });
  gistList = null;
  normalizeData();
  Object.keys(SYNC).forEach(snapshot);
}

async function refreshData() {
  let changed = false;
  for (const t of Object.keys(SYNC)) {
    if (dirty.has(t)) continue;
    const lista = await loadTable(t);
    if (!lista) continue;
    const nova = SYNC[t].norm(lista);
    if (JSON.stringify(nova) !== JSON.stringify(DB[t])) { DB[t] = nova; changed = true; }
    snapshot(t);
  }
  return changed;
}

async function mergeRemote(t) {
  const sy = SYNC[t];
  const remoto = await loadTable(t);
  if (!remoto) return;
  const snap = SNAP[t] || new Map();
  const pos = new Map(DB[t].map((x, k) => [sy.key(x), k]));
  sy.norm(remoto).forEach(r => {
    const k = sy.key(r), at = pos.get(k);
    if (at === undefined) { if (!snap.has(k)) DB[t].push(r); }
    else if (JSON.stringify(DB[t][at]) === snap.get(k)) DB[t][at] = r;
  });
}

function save(...tables) {
  tables.forEach(t => dirty.add(t));
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}

async function writeTable(t) {
  if (!META[t]) await (gistId(t) ? resolveFixedGist(t) : createGist(t));
  if (SYNC[t]) await mergeRemote(t);
  const r = await fetch('https://api.github.com/gists/' + META[t].id, {
    method: 'PATCH', headers: jsonHeaders(),
    body: JSON.stringify({ files: { [META[t].file]: { content: JSON.stringify(DB[t], null, 1) } } })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  if (SYNC[t]) snapshot(t);
}

async function flush() {
  for (const t of [...dirty]) {
    try { await writeTable(t); dirty.delete(t); }
    catch (e) { console.warn('Falha ao gravar o gist "' + t + '":', e); }
  }
}

async function resolveFixedGist(t) {
  const r = await fetch('https://api.github.com/gists/' + gistId(t), { headers: authHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('Não foi possível acessar o gist de "' + t + '" (' + r.status + ').');
  const file = Object.keys((await r.json()).files)[0];
  if (!file) throw new Error('O gist de "' + t + '" não tem arquivos.');
  META[t] = { id: gistId(t), file };
}

async function createGist(t) {
  try {
    const l = await fetch('https://api.github.com/gists?per_page=100', { headers: authHeaders(), cache: 'no-store' });
    if (l.ok) {
      const g = (await l.json()).find(x => x.description == 'INSIGHT ' + t);
      if (g) { META[t] = { id: g.id, file: Object.keys(g.files)[0] }; return; }
    }
  } catch (e) { }
  const file = t + '.json';
  const r = await fetch('https://api.github.com/gists', {
    method: 'POST', headers: jsonHeaders(),
    body: JSON.stringify({ description: 'INSIGHT ' + t, public: false, files: { [file]: { content: '[]' } } })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const g = await r.json();
  META[t] = { id: g.id, file };
}

function decodeSenha(b64txt) {
  try { return decodeURIComponent(escape(atob(String(b64txt || '').trim()))); }
  catch (e) { return null; }
}

function sha256Js(bytes) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const K = [], H = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let pr = true;
    for (let d = 2; d * d <= n; d++) if (n % d == 0) { pr = false; break; }
    if (!pr) continue;
    if (c < 8) H[c] = (Math.sqrt(n) % 1) * 4294967296 | 0;
    K[c++] = (Math.cbrt(n) % 1) * 4294967296 | 0;
  }
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(len * 8 / 4294967296));
  dv.setUint32(total - 4, (len * 8) >>> 0);
  for (let o = 0; o < total; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

async function sha256(txt) {
  const bytes = new TextEncoder().encode(String(txt));
  if (window.crypto && crypto.subtle) {
    try {
      const h = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { }

async function changePassword() {
  const atual = $('#p1').value, nova = $('#p2').value, msg = $('#pm'), btn = $('#pbtn');
  msg.style.color = '';
  msg.textContent = '';
  if (!atual) return msg.textContent = 'Informe a senha atual.';
  if (nova.length < 4) return msg.textContent = 'Nova senha muito curta.';
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const lista = await fetchRemoteUsers();
    if (!lista) throw new Error('Não foi possível consultar os usuários. Tente novamente.');
    const u = lista.find(x => normalizeUser(x).email.toLowerCase() == ME.email.toLowerCase());
    if (!u) throw new Error('Usuário não encontrado.');
    if (!(await passwordMatches(normalizeUser(u), atual))) throw new Error('Senha atual incorreta.');
    
    // Guarda o hash SHA-256 direto da nova senha
    u.senha = await sha256(nova);
    delete u.senhausuario;
    await patchUsersGist(lista);
    ME.senha = u.senha;
    if (savedLogin.load()) savedLogin.save(ME.email, nova);
    showToast('Senha alterada com sucesso!');
    go('perfil');
  } catch (e) {
    msg.textContent = e.message || 'Falha ao alterar a senha.';
    btn.disabled = false; btn.textContent = 'Alterar senha';
  }
}

async function resolveReset(id) {
  const nova = $('#np').value.trim(), msg = $('#nm'), btn = $('#nbtn');
  msg.textContent = '';
  if (nova.length < 4) return msg.textContent = 'A senha precisa ter pelo menos 4 caracteres.';
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await refreshNotifs();
    const n = DB.notificacoes.find(x => x.id == id);
    if (!n || n.status != 'pendente') throw new Error('Esta solicitação já foi tratada por outra pessoa.');
    
    const lista = await fetchRemoteUsers() || DB.usuarios;
    if (!lista) throw new Error('Não foi possível consultar os usuários.');
    const u = lista.find(x => normalizeUser(x).email.toLowerCase() == String(n.emailusuario).toLowerCase());
    if (!u) throw new Error('Usuário não encontrado.');
    
    // Guarda o hash SHA-256 direto da nova senha
    u.senha = await sha256(nova);
    delete u.senhausuario;
    await patchUsersGist(lista);
    const local = DB.usuarios.find(x => x.email.toLowerCase() == String(n.emailusuario).toLowerCase());
    if (local) local.senha = u.senha;
    
    let aviso = '';
    try { await closeNotif(id, 'atendida'); } catch (e) { aviso = 'A senha foi alterada, mas não consegui marcar a solicitação como atendida.'; }
    window._novaSenha = nova;
    openModal(`
      <h3>Senha definida!</h3><br>
      <p>Envie para <b>${esc(getUser(n.emailusuario).nome)}</b> (${esc(n.emailusuario)}):</p>
      <p style="font-size:1.4rem;color:var(--g);font-weight:800;margin:10px 0;word-break:break-all">${esc(nova)}</p>
      ${aviso ? `<p class="msg">${aviso}</p>` : ''}
      <button class="btn" onclick="navigator.clipboard?.writeText(window._novaSenha);showToast('Senha copiada!')">Copiar senha</button>
      <button class="btn o" onclick="closeM();render()">Fechar</button>`);
  } catch (e) {
    msg.textContent = e.message || 'Falha ao salvar a nova senha.';
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
  }
}


function syncUser(found) {
  let user = DB.usuarios.find(u => u.email.toLowerCase() == found.email.toLowerCase());
  if (user) Object.assign(user, found); else { DB.usuarios.push(found); user = found; }
  return user;
}

function gestoresDe(u, usuarios) {
  const outros = usuarios.filter(x => x.ativo && x.email.toLowerCase() != u.email.toLowerCase());
  const direto = String(u.emailgestor || '').trim().toLowerCase();
  const d = outros.filter(x => x.email.toLowerCase() == direto);
  if (d.length) return d.map(x => x.email);
  const mesma = outros.filter(x => x.empresa == u.empresa);
  const admins = mesma.filter(x => x.perfil == 'admin');
  return (admins.length ? admins : mesma.filter(x => x.perfil == 'aprovador')).map(x => x.email);
}

async function requestReset() {
  const email = $('#fe').value.trim().toLowerCase(), msg = $('#lm'), btn = $('#fbtn');
  msg.style.color = '';
  msg.textContent = '';
  if (!email) return msg.textContent = 'Informe seu e-mail.';
  btn.disabled = true; btn.textContent = 'Aguarde...';
  try {
    const lista = await fetchRemoteUsers() || DB.usuarios;
    if (!lista) throw new Error('Não foi possível consultar os usuários. Tente novamente.');
    const usuarios = lista.map(normalizeUser);
    const u = usuarios.find(x => x.email.toLowerCase() == email);
    if (!u) throw new Error('E-mail não encontrado.');
    if (!u.ativo) throw new Error('Usuário inativo. Fale com o administrador.');
    const gestores = gestoresDe(u, usuarios);
    if (!gestores.length) throw new Error('Não há gestor cadastrado para o seu usuário. Fale com o administrador.');

    const notifs = (await loadTable('notificacoes')) || [];
    const jaPendente = notifs.some(n => n.tipo == 'recuperar_senha' && n.status == 'pendente'
      && String(n.emailusuario).toLowerCase() == email);
    if (!jaPendente) {
      notifs.push({ id: Date.now(), tipo: 'recuperar_senha', emailusuario: u.email, empresa: u.empresa,
        gestores, data: now(), status: 'pendente', dataatendimento: '', atendidopor: '' });
      DB.notificacoes = notifs;
      await writeTable('notificacoes');
    }
    msg.style.color = 'var(--g)';
    msg.textContent = jaPendente
      ? 'Você já tem uma solicitação pendente. Aguarde o contato do seu gestor.'
      : 'Solicitação enviada! Seu gestor foi notificado e vai enviar uma nova senha para você.';
  } catch (e) {
    msg.textContent = e.message || 'Falha ao enviar a solicitação.';
  }
  btn.disabled = false; btn.textContent = 'Solicitar nova senha';
}

function ideaCard(i, full) {
  const likes = ideaLikes(i), comments = ideaComments(i);
  const liked = likes.some(l => l.autorcurtida == ME.email);

  const isOwner = ME.email == i.emailusuario;
  const canAdjust = full && isOwner && ['rascunho', 'aguardando resposta do idealizador'].includes(i.status);
  const canEval = full && isApprover() && STATUS_EDITAVEIS.includes(i.status);
  
  const details = full ? ` · Campanha: ${esc(i.programaideia)} · Benefício: ${esc(i.beneficio)} · ${i.data}
      · Conclusão: ${i.dataconclusao || '-'} · Aprovador: ${esc(getUser(i.emailaprovador).nome)}${i.privada ? ' · 🔒 privada' : ''}` : '';

  return `
  <div class="box idea">
    <h3>${esc(i.titulo)} ${full ? `<span class="badge s-${STATUS_CSS[i.status]}">${i.status}</span>` : ''}</h3>
    <p>${esc(i.descricao)}</p>
    <div class="meta">Por ${esc(getUser(i.emailusuario).nome)}${details}</div>
    ${full && i.parecer ? `<div class="cm"><b>Parecer:</b> ${esc(i.parecer)}</div>` : ''}
    <div class="act">
      <button class="${liked ? 'on' : ''}" onclick="toggleLike(${i.id})">👍 ${likes.length}</button>
      <button onclick="document.getElementById('c${i.id}').focus()">💬 ${comments.length}</button>
      ${canAdjust ? `<button onclick="openIdeaForm(${i.id})">✏️ Ajustar</button>` : ''}
      ${canEval ? `<button onclick="openEvalForm(${i.id})">🛠 Avaliar</button>` : ''}
    </div>
    ${comments.map(c => `<div class="cm"><b>${esc(getUser(c.autorcomentario).nome)}</b> <small>${c.data}</small><br>${esc(c.comentario)}</div>`).join('')}
    <div class="row" style="margin-top:8px">
      <input id="c${i.id}" placeholder="Comentar..." onkeydown="if(event.key=='Enter')addComment(${i.id})">
      <button class="btn s" onclick="addComment(${i.id})">Enviar</button>
    </div>
  </div>`;
}

function toggleLike(id) {
  const k = DB.curtidas.findIndex(c => c.idideia == id && c.autorcurtida == ME.email);
  if (k >= 0) DB.curtidas.splice(k, 1);

}

function moveCarousel(step, to) {
  clearInterval(carousel.timer);
  const imgs = [...document.querySelectorAll('.car img')];
  if (!imgs.length) return;
  carousel.index = to != null ? to : (carousel.index + step + imgs.length) % imgs.length;
  imgs.forEach((x, k) => x.classList.toggle('on', k == carousel.index));
  document.querySelectorAll('.dots i').forEach((x, k) => x.classList.toggle('on', k == carousel.index));
  $('#qt').textContent = QUOTES[carousel.index % QUOTES.length];
  carousel.timer = setInterval(() => moveCarousel(1), 4500);

const FILTRO_TODAS = { de: '', ate: '', campanha: '', status: '' };

function ideiasBaseTodas() {
  return companyIdeas().filter(i => i.status !== 'rascunho' || i.emailusuario === ME.email);
}
function filtraTodas(ignoraStatus) {
  const f = FILTRO_TODAS;
  const de = f.de ? new Date(f.de + 'T00:00:00') : null;
  const ate = f.ate ? new Date(f.ate + 'T23:59:59') : null;
  return ideiasBaseTodas().filter(i => {
    if (de || ate) {
      const d = parseDate(i.data);
      if (isNaN(d) || (de && d < de) || (ate && d > ate)) return false;
    }
    if (f.campanha && i.programaideia != f.campanha) return false;
    if (!ignoraStatus && f.status && i.status != f.status) return false;
    return true;
  });
}

function indicadorHtml() {
  const base = filtraTodas(true);
  const impl = base.filter(i => i.status == 'implantada').length;
  const repr = base.filter(i => i.status == 'reprovada').length;
  const total = impl + repr;
  const R = 54, C = 2 * Math.PI * R;
  const aImpl = total ? C * impl / total : 0;
  const aRepr = total ? C * repr / total : 0;
  const pct = total ? Math.round(impl * 100 / total) : 0;
  return `
    <div class="indic">
      <div class="donut">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#3a3f46" stroke-width="18"></circle>
          ${total ? `<circle cx="70" cy="70" r="${R}" fill="none" stroke="#2f80ff" stroke-width="18" stroke-dasharray="${aImpl} ${C - aImpl}"></circle>
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="#e53935" stroke-width="18" stroke-dasharray="${aRepr} ${C - aRepr}" stroke-dashoffset="${-aImpl}"></circle>` : ''}
        </svg>
        <div class="ct"><b>${total ? pct + '%' : '-'}</b><small>implantadas</small></div>
      </div>
      <div>
        <h3>Indicador: implantadas x reprovadas</h3>
        <div class="leg">
          <span><i style="background:#2f80ff"></i>Implantadas: <b>${impl}</b></span>
          <span><i style="background:#e53935"></i>Reprovadas: <b>${repr}</b></span>
        </div>
        ${total ? '' : '<p class="meta">Nenhuma ideia implantada ou reprovada no filtro atual.</p>'}
      </div>
    </div>`;
}

function formatDate(s) {
  if (!s) return '';
  if (s.includes('T') || s.includes('-')) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`;
    }
  }
  return s;
}

async function patchUsersGist(lista) {
  if (!GH_TOKEN) throw new Error('Não foi possível concluir a operação. Tente novamente.');
  const headers = jsonHeaders();
  let file = META.usuarios && META.usuarios.file;
  if (!file) {
    const g = await fetch('https://api.github.com/gists/' + GISTS.usuarios, { headers, cache: 'no-store' });
    if (!g.ok) throw new Error('Não foi possível concluir a operação. Tente novamente.');
    file = Object.keys((await g.json()).files)[0];
    META.usuarios = { id: GISTS.usuarios, file };
  }
  const r = await fetch('https://api.github.com/gists/' + GISTS.usuarios, {
    method: 'PATCH', headers,
    body: JSON.stringify({ files: { [file]: { content: JSON.stringify(lista, null, 2) } } })
  });
  if (!r.ok) throw new Error('Não foi possível salvar. Tente novamente.');
}

let REMOTE_PROGRAMAS = [];
let REMOTE_PROGRAMAS_FILENAME = 'programas.json';

async function fetchRemoteProgramas() {
  const targetId = GISTS.programas || '2b36bffaed668f45ee2ca85765430cd3';
  const url = `https://api.github.com/gists/${targetId}?t=${Date.now()}`;
  const response = await fetch(url, {
    headers: { Authorization: 'token ' + GH_TOKEN },
    cache: 'no-store'
  });
  if (!response.ok) throw new Error('Não foi possível carregar os programas do Gist (' + response.status + ').');
  const gistData = await response.json();
  const fileName = Object.keys(gistData.files)[0] || 'programas.json';
  REMOTE_PROGRAMAS_FILENAME = fileName;
  const fileObj = gistData.files[fileName];
  let contentText = fileObj.content;
  if (fileObj.truncated && fileObj.raw_url) {
    const rawRes = await fetch(fileObj.raw_url, { cache: 'no-store' });
    contentText = await rawRes.text();
  }
  const parsed = parseLooseJson(contentText);
  return Array.isArray(parsed) ? parsed : [];
}

async function updateRemoteProgramas(listaNova) {
  const targetId = GISTS.programas || '2b36bffaed668f45ee2ca85765430cd3';
  const url = `https://api.github.com/gists/${targetId}`;
  const response = await fetch(url, {
    method: 'PATCH',
    headers: {
      Authorization: 'token ' + GH_TOKEN,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      files: {
        [REMOTE_PROGRAMAS_FILENAME]: {
          content: JSON.stringify(listaNova, null, 2)
        }
      }
    })
  });
  if (!response.ok) throw new Error('Falha ao atualizar o Gist no GitHub (' + response.status + ').');
}

            <div class="kc p${c.prioridade}" data-id="${c.id}" onpointerdown="kStart(event, ${c.id})"><span class="kh" title="Arraste para mover">⠿</span><b>${esc(c.cardnome)}</b>
              <p class="meta">${esc(c.descricao)}<br>Autor: ${esc(getUser(c.emailautor).nome)}
                <br>Avaliador: ${esc(getUser(c.emailavaliador).nome)}<br>Prioridade: ${PRIORIDADE[c.prioridade]}</p>
              <button class="btn s o" onclick="openCardForm(${c.id})">Editar</button>

              ${cardComments(c)}
            </div>`).join('')}

const laneCards = (cards, lane) => cards.filter(c => c.status == lane)
  .sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || b.prioridade - a.prioridade);
let kdrag = null;

function kStart(e, id) {
  if (e.pointerType == 'mouse' && e.button !== 0) return;
  if (e.target.closest('button,input,select,textarea,a')) return;
  if (e.pointerType != 'mouse' && !e.target.closest('.kh')) return;
  kCleanup();
  kdrag = { id, el: e.currentTarget, x0: e.clientX, y0: e.clientY, started: false, lane: null, before: null };
  document.addEventListener('pointermove', kMove);
  document.addEventListener('pointerup', kEnd);
  document.addEventListener('pointercancel', kCleanup);
  document.addEventListener('keydown', kKey);
}

function kMove(e) {
  const d = kdrag;
  if (!d) return;
  if (!d.started) {
    if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    const r = d.el.getBoundingClientRect();
    d.started = true; d.dx = d.x0 - r.left; d.dy = d.y0 - r.top;
    d.ghost = d.el.cloneNode(true);
    d.ghost.classList.add('kfloat');
    d.ghost.style.width = r.width + 'px';
    document.body.appendChild(d.ghost);
    d.el.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }
  d.ghost.style.left = (e.clientX - d.dx) + 'px';
  d.ghost.style.top = (e.clientY - d.dy) + 'px';

  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  d.lane = d.before = null;
  const lane = (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest('.lane');
  if (lane) {
    lane.classList.add('over');
    d.lane = lane.dataset.lane;
    const alvo = [...lane.querySelectorAll('.kc:not(.dragging)')].find(c => {
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    d.before = alvo ? +alvo.dataset.id : null;
    const marca = document.createElement('div');
    marca.className = 'kdrop';
    if (alvo) lane.insertBefore(marca, alvo); else lane.appendChild(marca);
  }
  const board = document.querySelector('.board');
  if (board) {
    const b = board.getBoundingClientRect();
    if (e.clientX < b.left + 40) board.scrollLeft -= 16; else if (e.clientX > b.right - 40) board.scrollLeft += 16;
  }
  if (e.clientY < 70) scrollBy(0, -16); else if (e.clientY > innerHeight - 70) scrollBy(0, 16);
}

function kEnd() {
  const d = kdrag;
  kCleanup();
  if (d && d.started && d.lane) moveCard(d.id, d.lane, d.before);
}
const kKey = e => { if (e.key == 'Escape') kCleanup(); };

function kCleanup() {
  ['pointermove', 'pointerup', 'pointercancel', 'keydown'].forEach((t, k) =>
    document.removeEventListener(t, [kMove, kEnd, kCleanup, kKey][k]));
  if (kdrag) { if (kdrag.ghost) kdrag.ghost.remove(); kdrag.el.classList.remove('dragging'); }
  document.querySelectorAll('.lane.over').forEach(l => l.classList.remove('over'));
  document.querySelectorAll('.kdrop').forEach(x => x.remove());
  document.body.style.userSelect = '';
  kdrag = null;
}

function moveCard(id, lane, beforeId) {
  const c = DB.cards.find(x => x.id == id);
  if (!c) return;
  const empresa = DB.cards.filter(x => getUser(x.emailautor).empresa == ME.empresa);
  const dest = laneCards(empresa, lane).filter(x => x.id != id);
  const at = beforeId == null ? -1 : dest.findIndex(x => x.id == beforeId);
  dest.splice(at < 0 ? dest.length : at, 0, c);
  if (c.status != lane) c.dataconclusao = lane == 'FINALIZADO' ? now() : '';
  c.status = lane;
  dest.forEach((x, k) => { x.ordem = k + 1; });
  save('cards');
  render();
}

  const lista = DB.metas.map((m, k) => ({ m, k }))
    .filter(x => canSeeGoal(x.m) && (SHOW_DONE_GOALS || x.m.porcentagemConclusao < 100))

    ${lista.map(x => goalCard(x.m, x.k)).join('') || '<div class="box">Nenhuma meta ativa.</div>'}
  </div></div>`;

function goalCard(m, k) {
  const pct = m.porcentagemConclusao;
  return `
  <div class="box idea">
    <h3>${esc(m.meta)} <span class="badge ${pct >= 100 ? 's-implantada' : 's-implantacao'}">${pct}%</span></h3>
    <div class="pbar"><div style="width:${pct}%"></div></div>
    <div class="meta">Criada por ${esc(getUser(m.autor).nome)} em ${esc(m.dataCriacao)} · Previsão de conclusão: ${esc(m.dataPrevisaoConclusao)}</div>
    <div class="meta">Usuários: ${m.usuarios.map(u => esc(getUser(u.email).nome)).join(', ') || '-'}</div>
    ${m.submeta.map((x, j) => `
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.95rem;padding:3px 0;cursor:pointer">
        <input type="checkbox" style="margin:0" ${x.concluida ? 'checked' : ''} onchange="toggleSubgoal(${k},${j},this.checked)">
        <span style="${x.concluida ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(x.descricao)}</span>
      </label>`).join('')}
    ${isApprover() ? `<br><button class="btn s r" onclick="deleteGoal(${k})">Excluir</button>` : ''}
  </div>`;
}

function toggleSubgoal(k, j, val) {
  const m = DB.metas[k];
  if (!m || !m.submeta[j] || !canSeeGoal(m)) return;
  m.submeta[j].concluida = !!val;
  m.porcentagemConclusao = metaPct(m.submeta);
  save('metas'); render();
  if (m.porcentagemConclusao == 100) showToast('Meta concluída!');
}

function openGoalForm() {
  if (!isApprover()) return;
  openModal(`
    <h3>Nova meta</h3><br>
    <label>Meta</label><input id="m1">
    <label>Previsão de conclusão</label><input id="m2" type="date">
    <label>Submetas (cadastre ao menos uma)</label>
    <div id="msubs"></div>
    <button class="btn s o" onclick="addSubgoalField()">＋ Adicionar submeta</button><br><br>
    <label>Usuários com acesso</label>
    <div id="musers" style="max-height:160px;overflow:auto;margin-bottom:10px">
      ${companyUsers().filter(u => u.ativo).map(u => `
        <label style="display:flex;align-items:center;color:var(--fg)">
          <input type="checkbox" style="margin:0 6px 0 0" value="${esc(u.email)}" ${sameEmail(u.email, ME.email) ? 'checked disabled' : ''}>${esc(u.nome)}
        </label>`).join('')}
    </div>
    <p class="msg" id="mm"></p>
    <button class="btn" onclick="saveGoal()">Salvar</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
  addSubgoalField(false);
}

function addSubgoalField(focus = true) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.marginBottom = '8px';
  row.innerHTML = '<input class="sg" placeholder="Descrição da submeta"><button class="btn s r" type="button" onclick="this.parentNode.remove()">✕</button>';
  $('#msubs').appendChild(row);
  if (focus) row.querySelector('input').focus();
}

function saveGoal() {
  const meta = $('#m1').value.trim(), prev = $('#m2').value;
  const subs = [...document.querySelectorAll('#msubs .sg')].map(x => x.value.trim()).filter(Boolean);
  const users = [...document.querySelectorAll('#musers input:checked')].map(x => x.value);
  const erro = t => { $('#mm').textContent = t; };
  if (!meta) return erro('Informe a meta.');
  if (!prev) return erro('Informe a previsão de conclusão.');
  if (!subs.length) return erro('Cadastre ao menos uma submeta.');
  const [y, mo, d] = prev.split('-');
  DB.metas.push({
    meta,
    dataPrevisaoConclusao: `${d}-${mo}-${y} 23:59`,
    dataCriacao: now(),
    porcentagemConclusao: 0,
    autor: ME.email,
    submeta: subs.map(descricao => ({ descricao, concluida: false })),
    usuarios: users.map(email => ({ email }))
  });
  save('metas'); closeM(); render();
  showToast('Meta cadastrada!');
}

function deleteGoal(k) {
  const m = DB.metas[k];
  if (!m || !isApprover()) return;
  const key = SYNC.metas.key(m);
  showConfirm(`Deseja realmente excluir a meta "${m.meta}"?`, () => {
    const at = DB.metas.findIndex(x => SYNC.metas.key(x) == key);
    if (at < 0) return;
    DB.metas.splice(at, 1);
    save('metas'); render();
    showToast('Meta excluída!');
  });
}

/* ============================ 12. NOTIFICAÇÕES =========================== */
async function refreshNotifs() {
  try { const l = await loadTable('notificacoes'); if (l) DB.notificacoes = l; } catch (e) { }
}

async function pushNotification(notifObj) {
  try {
    const list = (await loadTable('notificacoes')) || [];
    list.push({
      id: Date.now(),
      data: now(),
      lida: false,
      ...notifObj
    });
    DB.notificacoes = list;
    await writeTable('notificacoes');
  } catch (e) { console.warn('Erro ao disparar notificação:', e); }
}

const userNotifs = () => (DB.notificacoes || []).filter(n => 
  String(n.destinoEmail).toLowerCase() === ME.email.toLowerCase() && !n.lida
);

const pendingResets = () => (DB.notificacoes || []).filter(n => n.tipo == 'recuperar_senha' && n.status == 'pendente' &&
  ((n.gestores || []).some(g => String(g).toLowerCase() == ME.email.toLowerCase()) || (isAdmin() && n.empresa == ME.empresa)));

function updateMenuBadge() {
  if (!ME) return;
  const nResets = pendingResets().length;
  const nNotifs = userNotifs().length;
  const total = nResets + nNotifs;
  
  const btn = $('#optbtn');
  const mnuNotifs = $('#mnuNotifs');
  
  if (btn) btn.textContent = '☰' + (total ? ' 🔔' + total : '');
  if (mnuNotifs) mnuNotifs.innerHTML = `Notificações${nNotifs ? ' (' + nNotifs + ')' : ''}`;
}

function viewNotifications() {
  const list = (DB.notificacoes || []).filter(n => String(n.destinoEmail).toLowerCase() === ME.email.toLowerCase());
  return `
  <div class="wrap one"><div>
    <h2>Minhas Notificações</h2><br>
    <button class="btn s o" onclick="refreshNotifs().then(render)">↻ Atualizar</button><br><br>
    ${byNewest(list).map(n => `
      <div class="box idea" style="${n.lida ? 'opacity:0.6;' : 'border-left-color:var(--g);'}">
        <h3>${esc(n.titulo)}</h3>
        <p>${esc(n.mensagem)}</p>
        <div class="meta">${esc(n.data)}</div>${!n.lida ? `<button class="btn s" onclick="markNotifAsRead(${n.id})">Marcar como lida</button>` : '<small>Lida</small>'}
      </div>`).join('') || '<div class="box">Nenhuma notificação encontrada.</div>'}
  </div></div>`;
}

async function markNotifAsRead(id) {
  const n = (DB.notificacoes || []).find(x => x.id === id);
  if (n) {
    n.lida = true;
    await writeTable('notificacoes');
    render();
  }
}

/* ===================== 13. SOLICITAÇÕES DE SENHA (GESTOR) ================ */
function viewPasswordRequests() {
  const list = pendingResets();
  return `
  <div class="wrap one"><div>
    <h2>Solicitações de senha</h2>
    <p class="meta">Quando alguém esquece a senha, você define uma nova aqui e envia para a pessoa manualmente.</p>
    <button class="btn s o" onclick="refreshNotifs().then(render)">↻ Atualizar</button><br><br>
    ${list.map(n => `
      <div class="box idea"><h3>${esc(getUser(n.emailusuario).nome)}</h3>
        <p>${esc(n.emailusuario)}</p><div class="meta">Solicitado em ${esc(n.data)}</div>
        <button class="btn s" onclick="openResetForm(${n.id})">Definir nova senha</button>
        <button class="btn s o" onclick="dismissReset(${n.id})">Dispensar</button>
      </div>`).join('') || '<div class="box">Nenhuma solicitação pendente.</div>'}
  </div></div>`;
}

function randomPassword(len = 8) {
  const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint32Array(len))].map(n => abc[n % abc.length]).join('');
}

function openResetForm(id) {
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n) return;
  openModal(`
    <h3>Nova senha para ${esc(getUser(n.emailusuario).nome)}</h3>
    <p class="meta">${esc(n.emailusuario)}</p><br>
    <label>Nova senha (pode trocar a sugestão)</label>
    <input id="np" value="${randomPassword()}">
    <p class="meta">Depois de salvar, envie esta senha para a pessoa. Ela pode alterá-la em "Meu perfil".</p>
    <p class="msg" id="nm"></p>
    <button class="btn" id="nbtn" onclick="resolveReset(${id})">Salvar nova senha</button>
    <button class="btn r" onclick="closeM()">Cancelar</button>`);
}

async function closeNotif(id, status) {
  await refreshNotifs();
  const n = DB.notificacoes.find(x => x.id == id);
  if (!n || n.status != 'pendente') throw new Error('Esta solicitação já foi tratada por outra pessoa.');
  Object.assign(n, { status, dataatendimento: now(), atendidopor: ME.email });
  await writeTable('notificacoes');
}

async function dismissReset(id) {
  showConfirm('Dispensar esta solicitação sem alterar a senha?', async () => {
    try { 
      await closeNotif(id, 'dispensada'); 
      showToast('Solicitação dispensada.');
    } catch (e) { 
      showToast(e.message || 'Falha ao dispensar.', 'warning'); 
    }
    render();
  });
}
