<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bisca – baralho para 2 jogadores</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f5132;--bg2:#0b3d26;--panel:#f6f3ea;--ink:#1c1c1c;--muted:#5d5d5d;--accent:#e0a526;--card:#fff;--red:#c62828;--blk:#1c1c1c;--line:#00000030}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b3d26;--bg2:#072a1a;--panel:#1f2420;--ink:#eee;--muted:#aab;--card:#f4f4ee;--line:#ffffff30}}
:root[data-theme="dark"]{--bg:#0b3d26;--bg2:#072a1a;--panel:#1f2420;--ink:#eee;--muted:#aab;--card:#f4f4ee;--line:#ffffff30}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,var(--bg),var(--bg2));color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:8px 0 4px;font-size:28px}
.sub{opacity:.8;margin:0 0 16px}
.panel{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;margin:12px 0}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);width:100%;margin:6px 0 10px;background:var(--card);color:#1c1c1c}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#1c1c1c;cursor:pointer}
button.sec{background:transparent;color:inherit;border:1px solid currentColor}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-size:40px;letter-spacing:8px;font-weight:800;text-align:center;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#00000040;padding:4px 12px;border-radius:99px;font-size:14px}
.turn{font-weight:700;padding:8px 12px;border-radius:10px;background:#00000040;text-align:center;margin:8px 0}
.turn.me{background:var(--accent);color:#1c1c1c}
.mid{display:flex;justify-content:center;gap:28px;margin:18px 0;align-items:flex-end}
.pile{text-align:center;font-size:13px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:96px}
.opp{margin-bottom:6px}
.card{width:56px;height:80px;border-radius:7px;background:var(--card);color:var(--blk);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;font-size:16px;line-height:1;box-shadow:0 2px 4px #0006;position:relative;user-select:none;border:0}
.card.red{color:var(--red)}
.card .s{align-self:center;font-size:28px}
.card .r2{align-self:flex-end;transform:rotate(180deg)}
.card.back{background:repeating-linear-gradient(45deg,#1e3a8a,#1e3a8a 6px,#2c4fb3 6px,#2c4fb3 12px);border:3px solid #fff}
.card.empty{background:transparent;border:2px dashed #ffffff60;box-shadow:none}
.card.sel{transform:translateY(-14px);outline:3px solid var(--accent)}
.card.can{cursor:pointer}
.card.can:hover{transform:translateY(-5px)}
.card.sel:hover{transform:translateY(-14px)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.msg{text-align:center;min-height:22px;opacity:.9;margin:6px 0}
.win{font-size:24px;font-weight:800;text-align:center;margin:10px 0}
.err{color:#ffb4b4;text-align:center}
details{margin-top:14px;opacity:.9}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<main id="app"><h1>🃏 Bisca</h1><p class="sub">Carregando…</p></main>
<script>
(function(){
var SU=["♠","♥","♦","♣"], RK=["2","3","4","5","6","Q","J","K","7","A"], PT=[0,0,0,0,0,2,3,4,10,11];
var app=document.getElementById("app");
var CFG={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}]};
var peer=null, conn=null, isHost=false, me=-1, myName="", code="", S=null, G=null, err="", closed=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function suit(n){return Math.floor(n/10);} function idx(n){return n%10;} function pts(n){return PT[idx(n)];}
function name(n){return RK[idx(n)]+SU[suit(n)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sortHand(h){return h.slice().sort(function(a,b){return suit(a)-suit(b)||idx(a)-idx(b);});}
function dealInto(g,first){
  var d=shuffle(Array.from({length:40},function(_,i){return i;}));
  g.h0=d.slice(0,3);g.h1=d.slice(3,6);g.stock=d.slice(6);g.trump=suit(g.stock[0]);
  g.t0=-1;g.t1=-1;g.s0=0;g.s1=0;g.turn=first;g.winner=null;g.status="playing";return g;
}
function genCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ",s="";for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function saveName(){try{localStorage.setItem("bisca_name",myName);}catch(e){}}
function loadName(){try{return localStorage.getItem("bisca_name")||"";}catch(e){return "";}}

/* ---------- lógica (roda só no anfitrião) ---------- */
function mustFollow(St,who){
  if(St["t"+(1-who)]<0||St.stock.length) return null;
  var ls=suit(St["t"+(1-who)]);
  return St["h"+who].some(function(c){return suit(c)===ls;})?ls:null;
}
function applyPlay(who,c){
  if(!G||G.status!=="playing"||G.turn!==who||G["t"+who]>=0) return;
  if(G["h"+who].indexOf(c)<0) return;
  var f=mustFollow(G,who); if(f!==null&&suit(c)!==f) return;
  var hand=G["h"+who].filter(function(x){return x!==c;}), lead=1-who;
  G["h"+who]=hand;
  if(G["t"+lead]<0){ G["t"+who]=c; G.turn=lead; G.log=G["p"+who].name+" jogou "+name(c)+"."; return; }
  var lc=G["t"+lead], w;
  if(suit(c)===suit(lc)) w=idx(c)>idx(lc)?who:lead; else if(suit(c)===G.trump) w=who; else w=lead;
  var gain=pts(c)+pts(lc);
  G["s"+w]+=gain;
  if(G.stock.length){ G["h"+w].push(G.stock.pop()); G["h"+(1-w)].push(G.stock.pop()); }
  G.t0=-1;G.t1=-1;G.turn=w;
  G.log=G["p"+w].name+" levou a vaza ("+name(lc)+" × "+name(c)+") e ganhou "+gain+" pontos.";
  if(!G.h0.length&&!G.h1.length){ G.status="over"; G.winner=G.s0>60?0:(G.s1>60?1:-1); }
}
function applyRematch(){ if(!G||G.status!=="over")return; dealInto(G,G.winner===0?1:0); G.log="Nova partida!"; }
function viewFor(who){
  var v=JSON.parse(JSON.stringify(G)), o="h"+(1-who);
  v[o]=v[o].map(function(){return -1;});
  v.stock=v.stock.map(function(x,i){return i===0?x:-1;});
  return v;
}
function broadcast(){ S=G; if(conn&&conn.open) conn.send({t:"state",s:viewFor(1)}); render(); }

/* ---------- rede (PeerJS, ponto a ponto) ---------- */
function needPeer(){ if(typeof Peer==="undefined"){err="Não foi possível carregar a biblioteca de rede. Verifique a internet.";render();return false;} return true; }
function createRoom(nm){
  if(!needPeer())return; myName=nm; saveName(); code=genCode(); isHost=true; me=0;
  peer=new Peer("bisca-"+code,{config:CFG});
  peer.on("open",function(){S={status:"waiting",code:code,p0:{name:nm}};render();});
  peer.on("error",function(e){ if(e.type==="unavailable-id"){createRoom(nm);} else {err="Erro de rede: "+e.type;S=null;render();} });
  peer.on("connection",function(c){
    if(conn&&conn.open){c.close();return;}
    conn=c;
    c.on("data",function(m){
      if(m.t==="hi"){
        G=dealInto({code:code,p0:{name:myName},p1:{name:String(m.name).slice(0,16)},log:""},0);
        G.log="Jogo iniciado! "+myName+" começa."; broadcast();
      }else if(m.t==="play"){ applyPlay(1,m.c); broadcast(); }
      else if(m.t==="rematch"){ applyRematch(); broadcast(); }
    });
    c.on("close",function(){ if(S&&S.status!=="waiting"){closed=true;render();} });
  });
  render();
}
function joinRoom(c,nm){
  if(!needPeer())return; code=c.toUpperCase().trim(); myName=nm; saveName(); isHost=false; me=1;
  err="Conectando…"; render();
  peer=new Peer(undefined,{config:CFG});
  peer.on("error",function(e){ err=e.type==="peer-unavailable"?"Sala não encontrada.":"Erro de rede: "+e.type; S=null; render(); });
  peer.on("open",function(){
    conn=peer.connect("bisca-"+code,{reliable:true});
    var to=setTimeout(function(){ if(!S){err="Não conseguiu conectar. Confira o código e se o anfitrião está com a sala aberta.";try{peer.destroy();}catch(e){}render();} },20000);
    conn.on("open",function(){ clearTimeout(to); err=""; conn.send({t:"hi",name:nm}); });
    conn.on("data",function(m){ if(m.t==="state"){S=m.s;render();} });
    conn.on("close",function(){ closed=true; render(); });
  });
}
function leave(){ try{if(conn)conn.close();if(peer)peer.destroy();}catch(e){} peer=conn=null;S=G=null;closed=false;err="";me=-1;render(); }
function act(msg){
  if(isHost){ if(msg.t==="play")applyPlay(0,msg.c); else applyRematch(); broadcast(); }
  else if(conn&&conn.open){ conn.send(msg); }
}
function playCard(c){
  if(!S||S.status!=="playing"||S.turn!==me||S["t"+me]>=0)return;
  var f=mustFollow(S,me); if(f!==null&&suit(c)!==f){err="Com o monte vazio, você deve seguir o naipe "+SU[f]+".";return render();}
  act({t:"play",c:c});
}

/* ---------- interface ---------- */
function cardHTML(n,o){
  o=o||{}; var red=suit(n)===1||suit(n)===2;
  return '<button class="card'+(red?" red":"")+(o.can?" can":"")+'" data-c="'+n+'"'+(o.can?"":' tabindex="-1"')+'><span>'+RK[idx(n)]+SU[suit(n)]+'</span><span class="s">'+SU[suit(n)]+'</span><span class="r2">'+RK[idx(n)]+'</span></button>';
}
function backs(n){var s="";for(var i=0;i<n;i++)s+='<div class="card back" style="width:34px;height:48px"></div>';return s;}
function render(){
  if(!S){
    app.innerHTML='<h1>🃏 Bisca</h1><p class="sub">Baralho online para 2 jogadores</p>'+
    '<div class="panel"><label>Seu nome<input id="nm" maxlength="16" placeholder="Ex.: Ana" value="'+esc(myName||loadName())+'"></label>'+
    '<div class="row"><button id="mk">Criar sala</button></div>'+
    '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'+
    '<label>Código da sala<input id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></label>'+
    '<div class="row"><button id="jn" class="sec">Entrar na sala</button></div>'+
    (err?'<p style="color:#c62828">'+esc(err)+'</p>':'')+'</div>'+
    '<details><summary>Como jogar</summary><div class="panel">Baralho de 40 cartas (sem 8, 9 e 10). Cada um recebe 3 cartas e uma carta vira o <b>trunfo</b>. '+
    'Vence a vaza a carta mais forte do naipe jogado, ou qualquer trunfo. Ordem: A, 7, K, J, Q, 6, 5, 4, 3, 2. Pontos: A=11, 7=10, K=4, J=3, Q=2, demais 0. '+
    'Quem ganha a vaza compra primeiro. Com o monte vazio, é obrigatório seguir o naipe. Mais de 60 pontos vence; 60 é empate.</div></details>';
    var nm=document.getElementById("nm");
    document.getElementById("mk").onclick=function(){var n=nm.value.trim();if(!n){err="Digite seu nome.";return render();}err="";createRoom(n);};
    document.getElementById("jn").onclick=function(){var n=nm.value.trim(),c=document.getElementById("cd").value.trim();if(!n||c.length<4){err="Informe nome e código.";return render();}joinRoom(c,n);};
    return;
  }
  if(S.status==="waiting"){
    app.innerHTML='<h1>🃏 Bisca</h1><div class="panel" style="text-align:center">Passe este código para o outro jogador:<div class="code">'+S.code+'</div>'+
    '<p style="color:var(--muted)">Ele deve abrir este mesmo arquivo/site e clicar em Entrar na sala.<br>Mantenha esta aba aberta. Esperando…</p><button id="lv" class="sec">Cancelar</button></div>';
    document.getElementById("lv").onclick=leave; return;
  }
  var opp=1-me, over=S.status==="over", myTurn=S.turn===me&&!over, oppName=S["p"+opp].name, f=myTurn?mustFollow(S,me):null;
  var h='<div class="bar"><h1 style="margin:0">🃏 Bisca</h1><span class="pill">Sala '+S.code+'</span><span class="pill">Trunfo '+SU[S.trump]+'</span><button class="sec" id="lv" style="color:#fff">Sair</button></div>';
  if(closed) h+='<div class="turn">⚠️ A conexão com o outro jogador caiu.</div>';
  h+='<div class="opp"><div style="text-align:center;margin-bottom:4px">'+esc(oppName)+' · '+S["h"+opp].length+' cartas</div><div class="hand" style="min-height:52px">'+backs(S["h"+opp].length)+'</div></div>';
  if(over){
    h+='<div class="win">'+(S.winner===-1?"Empate em 60 a 60!":(S.winner===me?"🎉 Você venceu!":"😮 "+esc(oppName)+" venceu."))+'<div style="font-size:16px;font-weight:500;margin-top:4px">Você '+S["s"+me]+' × '+S["s"+opp]+' '+esc(oppName)+'</div></div>';
  }else{
    h+='<div class="turn'+(myTurn?" me":"")+'">'+(myTurn?(S["t"+opp]>=0?"Sua vez: responda a carta":"Sua vez: jogue uma carta"):"Vez de "+esc(oppName)+"…")+'</div>';
  }
  h+='<div class="mid"><div class="pile">'+(S.stock.length?'<div style="display:flex;align-items:center"><div class="card back"></div><div style="margin-left:-34px;transform:rotate(90deg);margin-right:20px">'+cardHTML(S.stock[0])+'</div></div>':'<div class="card empty"></div>')+'<div>Monte ('+S.stock.length+')</div></div>'+
     '<div class="pile"><div class="hand" style="min-height:80px;min-width:120px;flex-wrap:nowrap">'+
     (S["t"+opp]>=0?cardHTML(S["t"+opp]):'<div class="card empty"></div>')+(S["t"+me]>=0?cardHTML(S["t"+me]):'<div class="card empty"></div>')+'</div><div>Mesa</div></div></div>';
  h+='<div class="msg">'+esc(err||S.log||"")+'</div>';
  h+='<div class="hand">'+sortHand(S["h"+me]).map(function(c){return cardHTML(c,{can:myTurn&&(f===null||suit(c)===f)});}).join("")+'</div>';
  h+='<div class="msg" style="margin-top:10px">Seus pontos: <b>'+S["s"+me]+'</b>'+(f!==null?' · siga o naipe '+SU[f]:"")+'</div>';
  if(over) h+='<div class="actions"><button id="rm">Jogar de novo</button></div>';
  app.innerHTML=h; err="";
  document.getElementById("lv").onclick=function(){if(confirm("Sair da sala?"))leave();};
  app.querySelectorAll(".hand .card.can").forEach(function(b){b.onclick=function(){playCard(+b.dataset.c);};});
  var rm=document.getElementById("rm"); if(rm)rm.onclick=function(){act({t:"rematch"});};
}
render();
})();
</script>
</body>
</html>
