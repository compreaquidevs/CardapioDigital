<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bisca – baralho para 2 jogadores</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f5132;--bg2:#0b3d26;--panel:#f6f3ea;--ink:#1c1c1c;--muted:#5d5d5d;--accent:#e0a526;--card:#fff;--red:#c62828;--blk:#1c1c1c;--line:#00000030}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b3d26;--bg2:#072a1a;--panel:#1f2420;--ink:#eee;--muted:#aab;--card:#f4f4ee;--line:#ffffff30}}
:root[data-theme="dark"]{--bg:#0b3d26;--bg2:#072a1a;--panel:#1f2420;--ink:#eee;--muted:#aab;--card:#f4f4ee;--line:#ffffff30}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,var(--bg),var(--bg2));color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:8px 0 4px;font-size:28px}
.sub{opacity:.8;margin:0 0 16px}
.panel{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;margin:12px 0}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);width:100%;margin:6px 0 10px;background:var(--card);color:#1c1c1c}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#1c1c1c;cursor:pointer}
button.sec{background:transparent;color:inherit;border:1px solid currentColor}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-size:40px;letter-spacing:8px;font-weight:800;text-align:center;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#00000040;padding:4px 12px;border-radius:99px;font-size:14px}
.turn{font-weight:700;padding:8px 12px;border-radius:10px;background:#00000040;text-align:center;margin:8px 0}
.turn.me{background:var(--accent);color:#1c1c1c}
.mid{display:flex;justify-content:center;gap:28px;margin:18px 0;align-items:flex-end}
.pile{text-align:center;font-size:13px}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:96px}
.opp{margin-bottom:6px}
.card{width:56px;height:80px;border-radius:7px;background:var(--card);color:var(--blk);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;font-size:16px;line-height:1;box-shadow:0 2px 4px #0006;position:relative;user-select:none;border:0}
.card.red{color:var(--red)}
.card .s{align-self:center;font-size:28px}
.card .r2{align-self:flex-end;transform:rotate(180deg)}
.card.back{background:repeating-linear-gradient(45deg,#1e3a8a,#1e3a8a 6px,#2c4fb3 6px,#2c4fb3 12px);border:3px solid #fff}
.card.empty{background:transparent;border:2px dashed #ffffff60;box-shadow:none}
.card.sel{transform:translateY(-14px);outline:3px solid var(--accent)}
.card.won{outline:3px solid var(--accent)}
.card.can{cursor:pointer}
.card.can:hover{transform:translateY(-5px)}
.card.sel:hover{transform:translateY(-14px)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.msg{text-align:center;min-height:22px;opacity:.9;margin:6px 0}
.win{font-size:24px;font-weight:800;text-align:center;margin:10px 0}
.err{color:#ffb4b4;text-align:center}
details{margin-top:14px;opacity:.9}
.eye{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:99px;background:#00000040;color:#fff;line-height:0}
.eye.on{background:var(--accent);color:#1c1c1c}
.eye svg{width:20px;height:20px}

<body>
<main id="app"><h1>🃏 Bisca</h1><p class="sub">Carregando…</p></main>
<script>
(function(){
var SU=["♠","♥","♦","♣"], RK=["2","3","4","5","6","Q","J","K","7","A"], PT=[0,0,0,0,0,2,3,4,10,11];
var app=document.getElementById("app");
var CFG={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}]};
var peer=null, conn=null, isHost=false, me=-1, myName="", code="", S=null, G=null, err="", closed=false;
var left=false, resuming=false, holdUntil=0, shownSeq=0, lastRx=0, retryTimer=null, hostTries=0, wl=null;
var HOLD_MS=2500, peek=false;
var EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function suit(n){return Math.floor(n/10);} function idx(n){return n%10;} function pts(n){return PT[idx(n)];}
function name(n){return RK[idx(n)]+SU[suit(n)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sortHand(h){return h.slice().sort(function(a,b){return suit(a)-suit(b)||idx(a)-idx(b);});}
function dealInto(g,first){
  var d=shuffle(Array.from({length:40},function(_,i){return i;}));
  g.h0=d.slice(0,3);g.h1=d.slice(3,6);g.stock=d.slice(6);
  // A carta que define o naipe do trunfo não pode ser 7 nem Ás.
  // Se a primeira carta do monte for uma dessas, troca pela primeira carta válida.
  if(idx(g.stock[0])===8||idx(g.stock[0])===9){
    for(var i=1;i<g.stock.length;i++){
      if(idx(g.stock[i])!==8&&idx(g.stock[i])!==9){
        var temp=g.stock[0];g.stock[0]=g.stock[i];g.stock[i]=temp;break;
      }
    }
  }
  g.trump=suit(g.stock[0]);
  g.t0=-1;g.t1=-1;g.s0=0;g.s1=0;g.w0=g.w0||0;g.w1=g.w1||0;g.seq=0;g.last=null;g.t7Played=false;g.turn=first;g.winner=null;g.status="playing";return g;
}
function genCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ",s="";for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function saveName(){try{localStorage.setItem("bisca_name",myName);}catch(e){}}
function loadName(){try{return localStorage.getItem("bisca_name")||"";}catch(e){return "";}}

/* ---------- lógica (roda só no anfitrião) ---------- */
/* Rela: 7 e Ás do trunfo */
function t7(St){return St.trump*10+8;} function tA(St){return St.trump*10+9;}
/* o 7 de trunfo não pode ser jogado "por cima" da carta do outro, exceto na última rodada (mão com 1 carta) */
/* Se o jogador tem o 7 E o Ás de trunfo na mão, nenhuma das duas cartas é bloqueada. */
function hasBoth(St,who){ var h=St["h"+who]; return h.indexOf(t7(St))>=0 && h.indexOf(tA(St))>=0; }
function blocked7(St,who,c){ return St["t"+(1-who)]>=0 && c===t7(St) && St["h"+who].length>1 && !hasBoth(St,who); }
/* O Ás de trunfo só pode ser jogado depois que o 7 de trunfo já saiu.
   Exceção: na última rodada, quando o jogador tem apenas uma carta na mão. */
function blockedAceTrump(St,who,c){ return c===tA(St) && !St.t7Played && St["h"+who].length>1 && !hasBoth(St,who); }
function applyPlay(who,c){
  if(!G||G.status!=="playing"||G.turn!==who||G["t"+who]>=0) return;
  if(G["h"+who].indexOf(c)<0) return;
  if(blocked7(G,who,c)||blockedAceTrump(G,who,c)) return;
  var hand=G["h"+who].filter(function(x){return x!==c;}), lead=1-who;
  G["h"+who]=hand;
  if(c===t7(G)) G.t7Played=true;
  if(G["t"+lead]<0){ G["t"+who]=c; G.turn=lead; G.log=G["p"+who].name+" jogou "+name(c)+"."; return; }
  var lc=G["t"+lead], w;
  if(suit(c)===suit(lc)) w=idx(c)>idx(lc)?who:lead; else if(suit(c)===G.trump) w=who; else w=lead;
  var gain=pts(c)+pts(lc), ca={}; ca[who]=c; ca[lead]=lc;
  G.seq=(G.seq||0)+1; var rela=(lc===t7(G)&&c===tA(G));
  G.last={c0:ca[0],c1:ca[1],w:w,gain:gain,rela:rela};
  if(rela) G["w"+who]=(G["w"+who]||0)+1;
  G["s"+w]+=gain;
  if(G.stock.length){ G["h"+w].push(G.stock.pop()); G["h"+(1-w)].push(G.stock.pop()); }
  G.t0=-1;G.t1=-1;G.turn=w;
  G.log=G["p"+w].name+" levou a vaza ("+name(lc)+" × "+name(c)+") e ganhou "+gain+" pontos."+(rela?" RELA! "+G["p"+who].name+" ganha uma vitória extra.":"");
  if(!G.h0.length&&!G.h1.length){ G.status="over"; G.winner=G.s0>60?0:(G.s1>60?1:-1); if(G.winner>=0) G["w"+G.winner]=(G["w"+G.winner]||0)+1; }
}
function applyRematch(){ if(!G||G.status!=="over")return; dealInto(G,G.winner===0?1:0); G.log="Nova partida!"; }
function viewFor(who){
  var v=JSON.parse(JSON.stringify(G)), o="h"+(1-who);
  v[o]=v[o].map(function(){return -1;});
  v.stock=v.stock.map(function(x,i){return i===0?x:-1;});
  return v;
}
function broadcast(){ S=G; saveSess(); if(conn&&conn.open){try{conn.send({t:"state",s:viewFor(1)});}catch(e){}} render(); }

/* ---------- sessão salva (para retomar após tela apagar / recarregar) ---------- */
function saveSess(){ if(left||!code)return; try{localStorage.setItem("bisca_sess",JSON.stringify({code:code,host:isHost,name:myName,G:isHost?G:null,t:Date.now()}));}catch(e){} }
function clearSess(){ try{localStorage.removeItem("bisca_sess");}catch(e){} }
function loadSess(){ try{var s=JSON.parse(localStorage.getItem("bisca_sess")||"null"); if(s&&s.code&&Date.now()-s.t<6*3600*1000)return s;}catch(e){} return null; }

/* ---------- manter a tela acesa ---------- */
function wake(){
  try{ if(navigator.wakeLock&&!wl&&!document.hidden){
    navigator.wakeLock.request("screen").then(function(l){ wl=l; l.addEventListener("release",function(){wl=null;}); }).catch(function(){});
  } }catch(e){}
}
function unwake(){ try{if(wl)wl.release();}catch(e){} wl=null; }

/* ---------- rede (PeerJS, ponto a ponto) ---------- */
function needPeer(){ if(typeof Peer==="undefined"){err="Não foi possível carregar a biblioteca de rede. Verifique a internet.";render();return false;} return true; }
function onState(s){ if(!S||S.status==="waiting") shownSeq=s.seq||0; closed=false; S=s; render(); }

function hostPeer(){
  if(left)return;
  var old=peer; peer=null; try{if(old)old.destroy();}catch(e){}
  var p=new Peer("bisca-"+code,{config:CFG}); peer=p;
  p.on("open",function(){
    if(p!==peer)return; hostTries=0; resuming=false;
    S=G?G:{status:"waiting",code:code,p0:{name:myName}};
    saveSess(); render();
  });
  p.on("disconnected",function(){
    if(p!==peer||left)return;
    setTimeout(function(){ if(p===peer&&!left&&p.disconnected){try{p.reconnect();}catch(e){}} },1000);
  });
  p.on("error",function(e){
    if(p!==peer||left)return;
    if(e.type==="unavailable-id"){
      if(resuming||G){
        if(++hostTries<20){ setTimeout(hostPeer,2500); return; }
        leave(); err="Não foi possível retomar a sala. Crie uma nova."; return render();
      }
      code=genCode(); hostPeer(); return;
    }
    if(S){ setTimeout(function(){ if(p!==peer||left)return; if(p.destroyed){hostTries=0;hostPeer();} else if(p.disconnected){try{p.reconnect();}catch(x){}} },3000); return; }
    err="Erro de rede: "+e.type; S=null; render();
  });
  p.on("connection",function(c){
    if(conn&&conn.open&&conn!==c){ if(!G){c.close();return;} try{conn.close();}catch(e){} }
    conn=c; lastRx=Date.now();
    c.on("data",function(m){
      if(c!==conn)return; lastRx=Date.now();
      if(m.t==="ping"){ try{c.send({t:"pong"});}catch(e){} }
      else if(m.t==="hi"){
        if(G){ closed=false; broadcast(); }
        else{
          G=dealInto({code:code,p0:{name:myName},p1:{name:String(m.name).slice(0,16)},log:""},0);
          G.log="Jogo iniciado! "+myName+" começa."; broadcast();
        }
      }else if(m.t==="play"){ applyPlay(1,m.c); broadcast(); }
      else if(m.t==="rematch"){ applyRematch(); broadcast(); }
    });
    c.on("close",function(){ if(c!==conn)return; if(S&&S.status!=="waiting"){closed=true;render();} });
  });
}
function createRoom(nm){
  if(!needPeer())return;
  left=false; resuming=false; myName=nm; saveName(); code=genCode(); isHost=true; me=0; G=null; S=null; hostTries=0;
  wake(); hostPeer(); render();
}

function scheduleGuestRetry(){
  if(left||isHost||retryTimer)return;
  retryTimer=setTimeout(function(){ retryTimer=null; guestConnect(); },2000);
}
function guestConnect(){
  if(left)return;
  var old=peer; peer=null; conn=null; try{if(old)old.destroy();}catch(e){}
  var p=new Peer(undefined,{config:CFG}); peer=p;
  var fresh=!S&&!resuming;
  function fail(msg){
    if(p!==peer||left)return;
    if(fresh){ err=msg; S=null; try{p.destroy();}catch(e){} peer=null; conn=null; render(); }
    else{ closed=true; render(); scheduleGuestRetry(); }
  }
  p.on("error",function(e){ fail(e.type==="peer-unavailable"?"Sala não encontrada.":"Erro de rede: "+e.type); });
  p.on("disconnected",function(){ if(p===peer&&!left){try{p.reconnect();}catch(e){}} });
  p.on("open",function(){
    if(p!==peer||left)return;
    var c=p.connect("bisca-"+code,{reliable:true}); conn=c;
    var to=setTimeout(function(){ if(p===peer&&!c.open) fail("Não conseguiu conectar. Confira o código e se o anfitrião está com a sala aberta."); },15000);
    c.on("open",function(){ clearTimeout(to); if(p!==peer)return; err=""; lastRx=Date.now(); c.send({t:"hi",name:myName}); });
    c.on("data",function(m){
      if(p!==peer)return; lastRx=Date.now();
      if(m.t==="ping"){ try{c.send({t:"pong"});}catch(e){} }
      else if(m.t==="state"){ resuming=false; onState(m.s); saveSess(); }
    });
    var lost=function(){ clearTimeout(to); if(p!==peer||left)return; if(!S&&!resuming)return; closed=true; render(); scheduleGuestRetry(); };
    c.on("close",lost); c.on("error",lost);
  });
}
function joinRoom(c,nm){
  if(!needPeer())return;
  left=false; resuming=false; code=c.toUpperCase().trim(); myName=nm; saveName(); isHost=false; me=1; S=null;
  err="Conectando…"; wake(); render(); guestConnect();
}
function resumeSession(s){
  if(!needPeer())return;
  left=false; resuming=true; code=s.code; myName=s.name; isHost=!!s.host; me=isHost?0:1; wake();
  if(isHost){ G=s.G||null; if(G){S=G;shownSeq=G.seq||0;closed=true;} hostTries=0; hostPeer(); }
  else{ guestConnect(); }
  render();
}
function ensureAlive(){
  if(left||!code||(!S&&!resuming))return;
  if(isHost){
    if(!peer||peer.destroyed) hostPeer();
    else if(peer.disconnected){ try{peer.reconnect();}catch(e){} }
  }else{
    if(!conn||!conn.open){ clearTimeout(retryTimer); retryTimer=null; guestConnect(); }
  }
  if(conn&&conn.open){ lastRx=Date.now()-9000; try{conn.send({t:"ping"});}catch(e){} }
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ wake(); ensureAlive(); } });
window.addEventListener("online",ensureAlive);
window.addEventListener("pageshow",function(){ wake(); ensureAlive(); });
/* batimento: detecta conexão "morta" depois que o celular volta do repouso */
setInterval(function(){
  if(left||!code||!conn||!conn.open)return;
  try{conn.send({t:"ping"});}catch(e){}
  if(Date.now()-lastRx>12000){
    if(isHost){ if(S&&S.status!=="waiting"){closed=true;render();} try{conn.close();}catch(e){} }
    else{ closed=true; render(); try{conn.close();}catch(e){} clearTimeout(retryTimer); retryTimer=null; guestConnect(); }
  }
},2500);

function leave(){
  left=true; clearTimeout(retryTimer); retryTimer=null; resuming=false;
  var p=peer; peer=null; var c=conn; conn=null;
  try{if(c)c.close();if(p)p.destroy();}catch(e){}
  unwake(); clearSess();
  S=G=null;peek=false;closed=false;err="";me=-1;code="";holdUntil=0;shownSeq=0;render();
}
function act(msg){
  if(isHost){ if(msg.t==="play")applyPlay(0,msg.c); else applyRematch(); broadcast(); }
  else if(conn&&conn.open){ conn.send(msg); }
}
function playCard(c){
  if(!S||S.status!=="playing"||S.turn!==me||S["t"+me]>=0||Date.now()<holdUntil)return;
  if(blocked7(S,me,c)){err="Você não pode jogar o 7 de trunfo por cima da carta do adversário (só na última rodada).";return render();}
  if(blockedAceTrump(S,me,c)){err="O Ás de trunfo só pode ser jogado depois que o 7 de trunfo sair (exceto na última rodada).";return render();}
  act({t:"play",c:c});
}

/* ---------- interface ---------- */
function cardHTML(n,o){
  o=o||{}; var red=suit(n)===1||suit(n)===2;
  return '<button class="card'+(red?" red":"")+(o.can?" can":"")+(o.won?" won":"")+'" data-c="'+n+'"'+(o.can?"":' tabindex="-1"')+'><span>'+RK[idx(n)]+SU[suit(n)]+'</span><span class="s">'+SU[suit(n)]+'</span><span class="r2">'+RK[idx(n)]+'</span></button>';
}
function tableCell(c,label,won){
  return '<div style="text-align:center">'+(c>=0?cardHTML(c,{won:won}):'<div class="card empty"></div>')+'<div style="font-size:11px;opacity:.8;margin-top:3px">'+esc(label)+'</div></div>';
}
function backs(n){var s="";for(var i=0;i<n;i++)s+='<div class="card back" style="width:34px;height:48px"></div>';return s;}
function render(){
  if(S&&S.status!=="waiting"){
    var sq=S.seq||0;
    if(sq>shownSeq){ shownSeq=sq; holdUntil=Date.now()+HOLD_MS; setTimeout(render,HOLD_MS+60); }
    else if(sq<shownSeq){ shownSeq=sq; holdUntil=0; }
  }
  if(!S&&resuming){
    app.innerHTML='<h1>🃏 Bisca</h1><div class="panel" style="text-align:center">Reconectando à sala <b>'+esc(code)+'</b>…<p style="color:var(--muted)">Aguarde alguns segundos.</p><button id="lv" class="sec">Cancelar</button></div>';
    document.getElementById("lv").onclick=leave; return;
  }
  if(!S){
    app.innerHTML='<h1>🃏 Bisca</h1><p class="sub">Baralho online para 2 jogadores</p>'+
    '<div class="panel"><label>Seu nome<input id="nm" maxlength="16" placeholder="Ex.: Ana" value="'+esc(myName||loadName())+'"></label>'+
    '<div class="row"><button id="mk">Criar sala</button></div>'+
    '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'+
    '<label>Código da sala<input id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></label>'+
    '<div class="row"><button id="jn" class="sec">Entrar na sala</button></div>'+
    (err?'<p style="color:#c62828">'+esc(err)+'</p>':'')+'</div>'+
    '<details><summary>Como jogar</summary><div class="panel">Baralho de 40 cartas (sem 8, 9 e 10). Cada um recebe 3 cartas e uma carta vira o <b>trunfo</b>. '+
    'Vence a vaza a carta mais forte do naipe jogado, ou qualquer trunfo. Ordem: A, 7, K, J, Q, 6, 5, 4, 3, 2. Pontos: A=11, 7=10, K=4, J=3, Q=2, demais 0. '+
    'Quem ganha a vaza compra primeiro. Mais de 60 pontos vence; 60 é empate. Cada partida vencida vale 1 vitória.<br><br><b>Rela:</b> se alguém jogar o 7 de trunfo e o adversário responder com o Ás de trunfo, o dono do Ás ganha <b>1 vitória extra na hora</b> (e leva 21 pontos); a partida continua e ainda vale mais uma vitória. O 7 de trunfo <b>não pode</b> ser jogado por cima da carta do adversário, exceto na última rodada. O <b>Ás de trunfo não pode ser jogado antes do 7 de trunfo</b>, exceto na última rodada. Se o jogador tiver o 7 <b>e</b> o Ás de trunfo na mão, pode jogar qualquer um dos dois a qualquer momento. O segundo jogador pode responder com carta de qualquer naipe; não é obrigatório acompanhar o naipe da primeira carta. Para fugir do rela, jogue o 7 de trunfo como primeira carta da rodada.</div></details>';
    var nm=document.getElementById("nm");
    document.getElementById("mk").onclick=function(){var n=nm.value.trim();if(!n){err="Digite seu nome.";return render();}err="";createRoom(n);};
    document.getElementById("jn").onclick=function(){var n=nm.value.trim(),c=document.getElementById("cd").value.trim();if(!n||c.length<4){err="Informe nome e código.";return render();}joinRoom(c,n);};
    return;
  }
  if(S.status==="waiting"){
    app.innerHTML='<h1>🃏 Bisca</h1><div class="panel" style="text-align:center">Passe este código para o outro jogador:<div class="code">'+S.code+'</div>'+
    '<p style="color:var(--muted)">Ele deve abrir este mesmo arquivo/site e clicar em Entrar na sala.<br>Mantenha esta aba aberta. Esperando…</p><button id="lv" class="sec">Cancelar</button></div>';
    document.getElementById("lv").onclick=leave; return;
  }
  var opp=1-me, over=S.status==="over", myTurn=S.turn===me&&!over, oppName=S["p"+opp].name;
  var holding=!!(S.last&&Date.now()<holdUntil), canPlay=myTurn&&!holding;
  var h='<div class="bar"><h1 style="margin:0">🃏 Bisca</h1><span class="pill">Sala '+S.code+'</span><span class="pill">Trunfo '+SU[S.trump]+'</span><span class="pill">Vitórias '+(S["w"+me]||0)+' × '+(S["w"+opp]||0)+'</span><button class="sec" id="lv" style="color:#fff">Sair</button></div>';
  if(closed) h+='<div class="turn">⚠️ Conexão perdida. Tentando reconectar…</div>';
  if(isHost&&me===0){
    /* Vantagem do criador da sala: olho para espiar as cartas do adversário.
       Oculto = nada aparece (nem versos nem contagem). Só o anfitrião tem as cartas reais (S === G). */
    h+='<div class="opp"><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:4px">'+esc(oppName)+
       '<button id="eye" class="eye'+(peek?' on':'')+'" aria-label="'+(peek?'Ocultar':'Mostrar')+' cartas do adversário" aria-pressed="'+peek+'">'+(peek?EYE_ON:EYE_OFF)+'</button></div>'+
       '<div class="hand" style="min-height:84px">'+(peek?sortHand(S["h"+opp].filter(function(c){return c>=0;})).map(function(c){return cardHTML(c);}).join(""):"")+'</div></div>';
  }else{
    h+='<div class="opp"><div style="text-align:center;margin-bottom:4px">'+esc(oppName)+' · '+S["h"+opp].length+' cartas</div><div class="hand" style="min-height:52px">'+backs(S["h"+opp].length)+'</div></div>';
  }
  if(over){
    h+='<div class="win">'+(S.winner===-1?"Empate em 60 a 60!":(S.winner===me?"🎉 Você venceu!":"😮 "+esc(oppName)+" venceu."))+'<div style="font-size:16px;font-weight:500;margin-top:4px">Você '+S["s"+me]+' × '+S["s"+opp]+' '+esc(oppName)+'</div></div>';
  }else{
    if(holding) h+='<div class="turn">'+(S.last.w===me?"Você levou a vaza":esc(oppName)+" levou a vaza")+' · +'+S.last.gain+' pts'+(S.last.rela?' · 🔥 RELA! +1 vitória para '+(S.last.w===me?"você":esc(oppName)):"")+'</div>';
    else h+='<div class="turn'+(myTurn?" me":"")+'">'+(myTurn?(S["t"+opp]>=0?"Sua vez: responda a carta":"Sua vez: jogue uma carta"):"Vez de "+esc(oppName)+"…")+'</div>';
  }
  var oppC=holding?S.last["c"+opp]:S["t"+opp], meC=holding?S.last["c"+me]:S["t"+me];
  h+='<div class="mid"><div class="pile">'+(S.stock.length?'<div style="display:flex;align-items:center"><div class="card back"></div><div style="margin-left:-34px;transform:rotate(90deg);margin-right:20px">'+cardHTML(S.stock[0])+'</div></div>':'<div class="card empty"></div>')+'<div>Monte ('+S.stock.length+')</div></div>'+
     '<div class="pile"><div class="hand" style="min-height:80px;min-width:150px;flex-wrap:nowrap;gap:12px">'+tableCell(oppC,oppName,holding&&S.last.w===opp)+tableCell(meC,"Você",holding&&S.last.w===me)+'</div><div>Mesa</div></div></div>';
  h+='<div class="msg">'+esc(err||(holding?"":S.log)||"")+'</div>';
  h+='<div class="hand">'+sortHand(S["h"+me]).map(function(c){return cardHTML(c,{can:canPlay&&!blocked7(S,me,c)&&!blockedAceTrump(S,me,c)});}).join("")+'</div>';
  h+='<div class="msg" style="margin-top:10px">Seus pontos: <b>'+S["s"+me]+'</b>'+'</div>';
  if(over) h+='<div class="actions"><button id="rm">Jogar de novo</button></div>';
  app.innerHTML=h; err="";
  document.getElementById("lv").onclick=function(){if(confirm("Sair da sala?"))leave();};
  app.querySelectorAll(".hand .card.can").forEach(function(b){b.onclick=function(){playCard(+b.dataset.c);};});
  var eye=document.getElementById("eye"); if(eye)eye.onclick=function(){peek=!peek;render();};
  var rm=document.getElementById("rm"); if(rm)rm.onclick=function(){act({t:"rematch"});};
}
var _s=loadSess(); if(_s) resumeSession(_s); else render();
})();
</script>
</body>
</html>
